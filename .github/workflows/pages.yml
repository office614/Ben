name: Deploy site to GitHub Pages

# Publishes the whole repo as a static site on every push to main.
# Pushes the site to a `gh-pages` branch with peaceiris/actions-gh-pages, which
# creates and serves the Pages site without needing the Pages REST API (the
# default GITHUB_TOKEN can't create a Pages site, so the official
# configure-pages/deploy-pages path fails with "Resource not accessible by
# integration" until Pages is enabled by hand). This path needs no manual toggle.
# The live URL is https://<owner>.github.io/<repo>/ — where the in-browser AI
# review and web-search look-up work over HTTPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          # Keep vendored assets served verbatim (no Jekyll processing).
          enable_jekyll: false
          exclude_assets: '.github'
