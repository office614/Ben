<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Diamond Welding & Fabrication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000000;
        }

        /* Logo centered */
        .logo-splash {
            max-width: 400px;
            width: 90%;
            height: auto;
            z-index: 5;
            filter: drop-shadow(0 0 30px rgba(249, 115, 22, 0.4));
            animation: logo-fade-in 1.5s ease-out;
        }

        @keyframes logo-fade-in {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Interactive button - positioned at bottom of logo */
        .logo-button {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            z-index: 20;
            cursor: pointer;
            border: none;
            background: transparent;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
            animation: glow-pulse 2.5s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
            }
            50% {
                box-shadow: 0 0 40px rgba(249, 115, 22, 0.8);
            }
        }

        .logo-button:hover {
            box-shadow: 0 0 50px rgba(249, 115, 22, 0.9);
            transform: translateX(-50%) scale(1.2);
        }

        .logo-button:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* Spark animation */
        @keyframes spark-burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .spark {
            position: fixed;
            pointer-events: none;
            width: 5px;
            height: 5px;
            background: radial-gradient(circle, #fbbf24, #f97316);
            border-radius: 50%;
            animation: spark-burst 1.2s ease-out forwards;
            box-shadow: 0 0 15px #f97316;
        }

        /* Loading state */
        .loading-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 30;
            background: rgba(0, 0, 0, 0);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.active {
            display: flex;
            animation: fade-in 0.5s ease-out forwards;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-text {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: rgba(249, 115, 22, 0.8);
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .logo-splash {
                max-width: 300px;
            }

            .logo-button {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <img src="assets/diamond-logo.jpeg" alt="Diamond Welding" class="logo-splash">
        
        <button class="logo-button" onclick="activateSplash()" title="Enter"></button>

        <div class="loading-overlay">
            <div class="loading-text">Entering...</div>
        </div>
    </div>

    <script>
        function createSpark(x, y) {
            const spark = document.createElement('div');
            spark.className = 'spark';

            const angle = Math.random() * Math.PI * 2;
            const velocity = 80 + Math.random() * 200;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;

            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            spark.style.setProperty('--tx', tx + 'px');
            spark.style.setProperty('--ty', ty + 'px');

            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 1200);
        }

        function activateSplash() {
            const button = document.querySelector('.logo-button');
            const loading = document.querySelector('.loading-overlay');
            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Disable button
            button.disabled = true;
            button.style.pointerEvents = 'none';

            // Create spark burst
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createSpark(centerX, centerY);
                }, i * 20);
            }

            // Show loading
            setTimeout(() => {
                loading.classList.add('active');
            }, 400);

            // Transition to landing page
            setTimeout(() => {
                window.location.href = 'landing.html';
            }, 1800);
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                document.querySelector('.logo-button').click();
            }
        });
    </script>
</body>
</html>
