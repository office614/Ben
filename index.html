<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Diamond Welding & Fabrication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000000;
        }

        .logo-splash {
            width: 80vw;
            max-width: 520px;
            height: auto;
            z-index: 5;
            filter: drop-shadow(0 0 60px rgba(249, 115, 22, 0.8)) drop-shadow(0 0 30px rgba(249, 115, 22, 0.4));
            animation: logo-fade-in 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            image-rendering: crisp-edges;
            object-fit: contain;
        }

        @keyframes logo-fade-in {
            from {
                opacity: 0;
                transform: scale(0.75);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .shield-button {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            z-index: 20;
            cursor: pointer;
            border: 1px solid rgba(249, 115, 22, 0.3);
            background: transparent;
            border-radius: 6px;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.35), inset 0 0 20px rgba(249, 115, 22, 0.08);
            animation: shield-glow 3.5s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .shield-text {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: rgba(249, 115, 22, 0.75);
            text-transform: uppercase;
            font-weight: 600;
            pointer-events: none;
        }

        @keyframes shield-glow {
            0%, 100% {
                box-shadow: 0 0 30px rgba(249, 115, 22, 0.35), inset 0 0 20px rgba(249, 115, 22, 0.08);
            }
            50% {
                box-shadow: 0 0 55px rgba(249, 115, 22, 0.65), inset 0 0 35px rgba(249, 115, 22, 0.15);
            }
        }

        .shield-button:hover {
            box-shadow: 0 0 70px rgba(249, 115, 22, 0.75), inset 0 0 40px rgba(249, 115, 22, 0.2);
            border-color: rgba(249, 115, 22, 0.6);
            transform: translateX(-50%) scale(1.1);
        }

        .shield-button:active {
            transform: translateX(-50%) scale(0.95);
        }

        @keyframes spark-burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .spark {
            position: fixed;
            pointer-events: none;
            width: 7px;
            height: 7px;
            background: radial-gradient(circle at 25% 25%, #fff, #fbbf24, #f97316);
            border-radius: 50%;
            animation: spark-burst 1.5s ease-out forwards;
            box-shadow: 0 0 20px #f97316;
        }

        .loading-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 30;
            background: rgba(0, 0, 0, 0);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.active {
            display: flex;
            animation: fade-in 0.6s ease-out forwards;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-text {
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: rgba(249, 115, 22, 0.85);
            text-transform: uppercase;
            animation: pulse 1.6s ease-in-out infinite;
            font-weight: 500;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .logo-splash {
                max-width: 380px;
            }

            .shield-button {
                width: 70px;
                height: 70px;
            }

            .shield-text {
                font-size: 0.65rem;
            }
        }

        @media (max-width: 480px) {
            .logo-splash {
                max-width: 320px;
            }

            .shield-button {
                width: 65px;
                height: 65px;
                bottom: 18%;
            }

            .shield-text {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <img class="logo-splash" src="assets/diamond-logo.png" alt="Diamond Welding & Fabrication" />
        <button class="shield-button" onclick="activateSplash()" title="Enter Site">
            <div class="shield-text">Enter</div>
        </button>
        <div class="loading-overlay">
            <div class="loading-text">Igniting...</div>
        </div>
    </div>

    <script>
        function createSpark(x, y) {
            const spark = document.createElement('div');
            spark.className = 'spark';
            const angle = Math.random() * Math.PI * 2;
            const velocity = 110 + Math.random() * 240;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            spark.style.setProperty('--tx', tx + 'px');
            spark.style.setProperty('--ty', ty + 'px');
            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 1500);
        }

        function activateSplash() {
            const button = document.querySelector('.shield-button');
            const loading = document.querySelector('.loading-overlay');
            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            button.disabled = true;
            button.style.pointerEvents = 'none';

            for (let i = 0; i < 65; i++) {
                setTimeout(() => createSpark(centerX, centerY), i * 16);
            }

            setTimeout(() => loading.classList.add('active'), 400);
            setTimeout(() => window.location.href = 'landing.html', 2100);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                document.querySelector('.shield-button').click();
            }
        });
    </script>
</body>
</html>
