<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMC – Earth Moving Creations</title>
</head>
<body>
<style>
  :root {
    --bg-0: #0e0e11;
    --bg-1: #050506;
    --emc-red: #ff1f3d;
    --silver: #c9ccd1;
  }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, var(--bg-0) 0%, var(--bg-1) 72%, #000 100%);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 24px;
    z-index: 2;
  }

  .logo-wrap {
    position: relative;
    width: min(86vw, 620px);
    border-radius: 22px;
    cursor: pointer;
    outline: none;
    animation: idleGlow 3.4s ease-in-out infinite;
    transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
    will-change: transform, filter;
  }
  .logo-wrap:hover,
  .logo-wrap:focus-visible { transform: translateY(-4px) scale(1.015); }
  .logo-wrap:focus-visible {
    box-shadow: 0 0 0 3px rgba(255,31,61,0.6), 0 0 50px rgba(255,31,61,0.5);
  }

  .logo-img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 22px;
    -webkit-user-drag: none;
  }

  @keyframes idleGlow {
    0%, 100% { filter: brightness(0.98) drop-shadow(0 0 18px rgba(255,31,61,0.25)); }
    50%      { filter: brightness(1.07) drop-shadow(0 0 40px rgba(255,31,61,0.5)); }
  }

  /* CSS excavator bucket — only used for the pickup beat on press */
  .bucket-rig {
    position: absolute;
    top: 0;
    left: 68%;
    width: 15%;
    transform: translate(-50%, -160%);
    opacity: 0;
    pointer-events: none;
    z-index: 6;
  }
  .bucket-arm {
    width: 26%;
    min-width: 6px;
    height: 70px;
    margin: 0 auto;
    background: linear-gradient(90deg, #4a4a4a, #222);
    border-radius: 3px;
    box-shadow: 0 0 8px rgba(255,31,61,0.5);
  }
  .bucket {
    width: 100%;
    aspect-ratio: 1.6 / 1;
    background: linear-gradient(180deg, #3a3a3a, #141414);
    border: 2px solid #5a5a5a;
    border-top: none;
    border-radius: 0 0 42% 42%;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.6), 0 0 16px rgba(255,60,20,0.45);
  }

  .enter-btn {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--silver);
    background: rgba(20,20,22,0.7);
    border: 1.5px solid rgba(255,31,61,0.55);
    border-radius: 999px;
    padding: 13px 26px;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(255,31,61,0.22);
    transition: background 0.25s, color 0.25s, box-shadow 0.25s, transform 0.15s;
  }
  .enter-btn:hover,
  .enter-btn:focus-visible {
    background: rgba(255,31,61,0.92);
    color: #fff;
    box-shadow: 0 0 30px rgba(255,31,61,0.6);
    outline: none;
  }
  .enter-btn:active { transform: scale(0.97); }

  .hint {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #6a6a70;
    margin: 0;
    animation: hintPulse 2.6s ease-in-out infinite;
  }
  @keyframes hintPulse { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

  /* ---- entering transition ---- */
  .stage.entering .logo-wrap { animation: scoop 1.5s cubic-bezier(0.5,0,0.4,1) forwards; cursor: default; }
  .stage.entering .bucket-rig { animation: bucketPick 1.5s cubic-bezier(0.4,0,0.3,1) forwards; }
  .stage.entering .enter-btn,
  .stage.entering .hint { animation: fadeOut 0.35s forwards; }

  @keyframes scoop {
    0%   { transform: translateY(0) scale(1) rotate(0deg); filter: brightness(1); }
    36%  { transform: translateY(6px) scale(1.012) rotate(0deg); filter: brightness(1.28) drop-shadow(0 0 48px rgba(255,31,61,0.75)); }
    58%  { transform: translateY(-28px) scale(0.985) rotate(-1.5deg); }
    100% { transform: translateY(-118vh) scale(0.55) rotate(-6deg); filter: brightness(1.3); opacity: 0.15; }
  }
  @keyframes bucketPick {
    0%   { opacity: 0; transform: translate(-50%, -160%); }
    22%  { opacity: 1; transform: translate(-50%, -120%); }
    40%  { opacity: 1; transform: translate(-50%, -30%); }
    56%  { opacity: 1; transform: translate(-50%, -52%); }
    100% { opacity: 0.9; transform: translate(-50%, -175vh); }
  }
  @keyframes fadeOut { to { opacity: 0; } }

  .curtain {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #170406 0%, #000 82%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
    z-index: 9;
  }
  .curtain.show { opacity: 1; }

  .arrive {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease 0.15s;
    z-index: 10;
  }
  .arrive.show { opacity: 1; pointer-events: auto; }
  .arrive-inner { max-width: 460px; }
  .arrive h2 {
    font-family: 'Arial Black', Arial, sans-serif;
    color: var(--emc-red);
    letter-spacing: 1px;
    font-size: 22px;
    margin: 0 0 10px;
    text-shadow: 0 0 18px rgba(255,31,61,0.5);
  }
  .arrive p { color: #9a9aa0; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
  .replay {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--silver); background: none; border: 1px solid #444; border-radius: 999px;
    padding: 10px 22px; cursor: pointer; transition: border-color .2s, color .2s;
  }
  .replay:hover { border-color: var(--emc-red); color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    .logo-wrap, .hint { animation: none; }
  }
</style>

<div class="stage" id="stage">
  <div class="logo-wrap" id="logoWrap" role="button" tabindex="0" aria-label="Enter the EMC Contract App">
    <img class="logo-img" src="assets/emc-logo.jpeg" alt="EMC — Earth Moving Creations" draggable="false">
    <div class="bucket-rig" id="bucketRig">
      <div class="bucket-arm"></div>
      <div class="bucket"></div>
    </div>
  </div>
  <button class="enter-btn" id="enterBtn" type="button">Enter Contract App &rarr;</button>
  <p class="hint" id="hint">Tap the logo to enter</p>
</div>

<div class="curtain" id="curtain"></div>
<div class="arrive" id="arrive">
  <div class="arrive-inner">
    <h2>Entering the Contract App&hellip;</h2>
    <p>This is where your contract app loads. Add its web address and the logo hands off straight into it.</p>
    <button class="replay" id="replay" type="button">Replay animation</button>
  </div>
</div>

<script>
  // Replace with your contract app's live URL and the logo will redirect straight into it.
  const APP_URL = "https://REPLACE-WITH-CONTRACT-APP-URL";

  const stage    = document.getElementById('stage');
  const logoWrap = document.getElementById('logoWrap');
  const enterBtn = document.getElementById('enterBtn');
  const curtain  = document.getElementById('curtain');
  const arrive   = document.getElementById('arrive');
  const replay   = document.getElementById('replay');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isPlaceholder = APP_URL.indexOf('REPLACE-WITH') !== -1;
  let entering = false;

  function finish() {
    if (isPlaceholder) {
      arrive.classList.add('show'); // demo mode: no real URL yet
    } else {
      window.location.href = APP_URL;
    }
  }

  function enter() {
    if (entering) return;
    entering = true;
    stage.classList.add('entering');
    if (reduceMotion) {
      curtain.classList.add('show');
      setTimeout(finish, 350);
      return;
    }
    setTimeout(() => curtain.classList.add('show'), 1150);
    setTimeout(finish, 1650);
  }

  function reset() {
    entering = false;
    stage.classList.remove('entering');
    curtain.classList.remove('show');
    arrive.classList.remove('show');
    void stage.offsetWidth;
  }

  logoWrap.addEventListener('click', enter);
  enterBtn.addEventListener('click', enter);
  logoWrap.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); }
  });
  replay.addEventListener('click', reset);
</script>
</body>
</html>
