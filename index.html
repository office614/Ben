<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Welding & Fabrication</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; }
        body { display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; }

        .splash {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .logo {
            max-width: 80vw;
            max-height: 50vh;
            width: auto;
            height: auto;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .btn {
            padding: 18px 50px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            color: white;
            background: #f97316;
            border: 2px solid #f97316;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 40px rgba(249, 115, 22, 0.6);
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 60px rgba(249, 115, 22, 0.9);
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="splash">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="assets/welding-background.mp4" type="video/mp4">
        </video>

        <div class="content">
            <img src="assets/diamond-logo.png" alt="Diamond Logo" class="logo">
            <button class="btn" onclick="goToSite()">ENTER SITE</button>
        </div>
    </div>

    <script>
        function goToSite() {
            window.location.href = 'landing.html';
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                goToSite();
            }
        });
    </script>
</body>
</html>
