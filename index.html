<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMC – Trade Contract & Dispute Protection</title>
</head>
<body>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  :root {
    --accent: #ff1a44;
    --accent-soft: color-mix(in srgb, var(--accent) 55%, transparent);
    --accent-faint: color-mix(in srgb, var(--accent) 22%, transparent);
    --silver: #c9ccd1;
    --ink: #e7e7ea;
    --muted: #8a8a92;
    --panel: rgba(22,22,25,0.72);
    --card: #141417;
    --card-2: #1a1a1f;
    --line: #2a2a30;
    --bg-0: #0e0e11;
    --good: #37d67a;
    --warn: #ffb020;
    --bad: #ff4d4d;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center, var(--bg-0) 0%, #050506 72%, #000 100%);
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===================== LANDING VIEW ===================== */
  .landing {
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    user-select: none;
  }
  .landing.hidden { display: none; }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 16px; }

  .logo-container {
    position: relative; width: 760px; height: 300px; max-width: 100vw;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .logo {
    font-family: 'Arial Black', Impact, Arial, sans-serif;
    font-size: 168px; font-weight: 900; color: var(--accent);
    text-shadow: 0 0 1px #ffd0d8, 0 0 6px var(--accent), 0 0 14px var(--accent), 0 0 30px var(--accent-soft);
    letter-spacing: -8px; position: relative; z-index: 5; line-height: 1;
  }
  .c-letter { display: inline-block; position: relative; transition: none; transform-origin: center bottom; will-change: transform, opacity; }
  .subtitle {
    margin-top: 12px; font-size: 17px; color: var(--silver); letter-spacing: 10px;
    text-transform: uppercase; text-shadow: 0 0 8px rgba(192,192,192,0.4); z-index: 5; text-align: center;
  }

  .excavator { position: absolute; width: 160px; height: 140px; top: -160px; left: 58%; transform: translateX(-50%); opacity: 0; z-index: 10; pointer-events: none; transition: none; }
  .cab { width: 70px; height: 45px; background: linear-gradient(180deg, #4a4a4a, #2a2a2a); border: 3px solid #666; border-radius: 6px 6px 2px 2px; position: absolute; top: 0; left: 20px; box-shadow: inset 0 2px 4px rgba(255,255,255,0.15); }
  .cab::after { content: ''; position: absolute; top: 8px; left: 10px; width: 45px; height: 18px; background: #1a3a5c; border: 2px solid #333; border-radius: 2px; }
  .boom { width: 12px; height: 70px; background: linear-gradient(90deg, #555, #333); position: absolute; top: 30px; left: 55px; transform-origin: top center; border-radius: 2px; }
  .stick { width: 10px; height: 55px; background: linear-gradient(90deg, #555, #333); position: absolute; top: 90px; left: 56px; transform-origin: top center; border-radius: 2px; }
  .bucket { width: 55px; height: 35px; background: linear-gradient(180deg, #3a3a3a, #1a1a1a); border: 3px solid #555; border-radius: 0 0 8px 8px; position: absolute; top: 135px; left: 35px; transform-origin: top center; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
  .bucket::before { content: ''; position: absolute; bottom: -8px; left: 4px; right: 4px; height: 10px; background: repeating-linear-gradient(90deg, #222 0 8px, transparent 8px 12px); }
  .bucket::after { content: ''; position: absolute; bottom: 4px; left: 6px; right: 6px; height: 14px; background: linear-gradient(to bottom, #ff6600, #cc2200); border-radius: 0 0 4px 4px; box-shadow: 0 0 12px #ff4400, 0 0 24px #ff2200; opacity: 0; transition: opacity 0.3s; }
  .bucket.has-load::after { opacity: 1; }
  .dirt-pile { position: absolute; width: 90px; height: 35px; background: radial-gradient(ellipse at center, #5a3a1a 0%, #3a2510 70%, transparent 100%); border-radius: 50%; bottom: 40px; left: 58%; transform: translateX(-50%) scale(0); opacity: 0; z-index: 3; box-shadow: 0 0 20px rgba(255,80,0,0.3); }
  .ground-glow { position: absolute; width: 200px; height: 60px; background: radial-gradient(ellipse at center, rgba(255,60,0,0.25) 0%, transparent 70%); bottom: 20px; left: 58%; transform: translateX(-50%); opacity: 0; z-index: 1; pointer-events: none; }

  .controls { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .field { display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .field label { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #7c7c84; padding-left: 4px; }
  .field select {
    appearance: none; -webkit-appearance: none; font-size: 14px; font-weight: 600; color: var(--silver);
    background: var(--panel); border: 1.5px solid var(--accent-soft); border-radius: 12px;
    padding: 12px 40px 12px 16px; min-width: 210px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--silver) 50%), linear-gradient(135deg, var(--silver) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
    transition: border-color .2s, box-shadow .2s;
  }
  .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint); }
  .field select option { background: #141416; color: var(--silver); }

  .enter-btn {
    font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--silver);
    background: var(--panel); border: 1.5px solid var(--accent-soft); border-radius: 999px; padding: 15px 34px;
    cursor: pointer; box-shadow: 0 0 20px var(--accent-faint);
    transition: background .25s, color .25s, box-shadow .25s, transform .15s, opacity .25s; animation: btnPulse 2.8s ease-in-out infinite;
  }
  .enter-btn:hover, .enter-btn:focus-visible { background: var(--accent); color: #fff; box-shadow: 0 0 34px var(--accent-soft); outline: none; animation: none; }
  .enter-btn:active { transform: scale(0.97); }
  .enter-btn[disabled] { opacity: .4; cursor: not-allowed; animation: none; box-shadow: none; border-color: #3a3a3e; color: #6a6a70; }
  @keyframes btnPulse { 0%,100%{box-shadow:0 0 16px var(--accent-faint)} 50%{box-shadow:0 0 34px var(--accent-soft)} }
  .hint { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #6a6a70; animation: hintPulse 2.6s ease-in-out infinite; }
  @keyframes hintPulse { 0%,100%{opacity:.35} 50%{opacity:.85} }

  .stage.entering .enter-btn, .stage.entering .hint, .stage.entering .controls { animation: fadeOut .35s forwards; pointer-events: none; }
  @keyframes fadeOut { to { opacity: 0; } }

  .curtain { position: fixed; inset: 0; background: radial-gradient(ellipse at center, #170406 0%, #000 82%); opacity: 0; pointer-events: none; transition: opacity .7s ease; z-index: 40; }
  .curtain.show { opacity: 1; }

  /* ===================== APP SHELL VIEW ===================== */
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 248px 1fr; opacity: 0; transition: opacity .5s ease; z-index: 20; }
  .app.show { opacity: 1; }
  .app.hidden { display: none; }

  .sidebar { background: #0b0b0d; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 16px; gap: 8px; }
  .brand-mini { padding: 6px 8px 18px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .bm-wordmark { font-family: 'Arial Black', Arial, sans-serif; font-size: 30px; font-weight: 900; color: var(--accent); letter-spacing: -1px; text-shadow: 0 0 10px var(--accent-soft); }
  .bm-sub { display: block; font-size: 8.5px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 12px 12px; border-radius: 10px; cursor: pointer; transition: background .15s, color .15s; }
  .nav-item .ic { width: 16px; text-align: center; opacity: .9; }
  .nav-item:hover { background: #16161a; color: var(--ink); }
  .nav-item.active { background: color-mix(in srgb, var(--accent) 16%, transparent); color: #fff; box-shadow: inset 2px 0 0 var(--accent); }
  .nav-exit { margin-top: auto; background: none; border: 1px solid var(--line); color: var(--muted); font-size: 12px; letter-spacing: 1px; padding: 10px; border-radius: 10px; cursor: pointer; transition: border-color .2s, color .2s; }
  .nav-exit:hover { border-color: var(--accent-soft); color: var(--ink); }

  .workspace { position: relative; overflow-y: auto; padding: 30px 36px 60px; }
  .app-watermark { position: fixed; right: -60px; bottom: -50px; font-family: 'Arial Black', Arial, sans-serif; font-size: 340px; font-weight: 900; color: var(--accent); opacity: 0.035; letter-spacing: -14px; pointer-events: none; z-index: 0; user-select: none; }
  .ws-head { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 26px; }
  .ws-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.3px; }
  .ws-sub { color: var(--muted); font-size: 13px; margin-top: 4px; letter-spacing: .3px; }
  .ctx-chip { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--silver); max-width: 340px; line-height: 1.4; }
  .ctx-chip b { color: #fff; }

  .ws-body { position: relative; z-index: 1; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 26px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .tile .k { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-size: 28px; font-weight: 800; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .tile .v.accent { color: var(--accent); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  .card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .card .desc { color: var(--muted); font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  .callout { background: color-mix(in srgb, var(--accent) 10%, var(--card)); border: 1px solid var(--accent-soft); border-radius: 14px; padding: 18px 20px; margin-bottom: 22px; }
  .callout .k { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .callout p { margin-top: 8px; font-size: 14px; line-height: 1.6; color: var(--silver); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th { text-align: left; color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 0 12px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
  table.data td { padding: 13px 12px; border-bottom: 1px solid #202026; font-variant-numeric: tabular-nums; }
  table.data tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .5px; padding: 4px 10px; border-radius: 999px; }
  .pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.bad  { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .pill.mute { background: #202026; color: var(--muted); }

  .btn { font-size: 13px; font-weight: 700; letter-spacing: .5px; color: #fff; background: var(--accent); border: none; border-radius: 10px; padding: 11px 18px; cursor: pointer; transition: filter .2s, transform .1s; }
  .btn:hover { filter: brightness(1.1); } .btn:active { transform: scale(.98); }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--silver); }
  .btn.ghost:hover { border-color: var(--accent-soft); color: #fff; }
  .row-actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }

  .clause { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid #202026; }
  .clause:last-child { border-bottom: none; }
  .clause .name { font-size: 13.5px; font-weight: 600; }
  .clause .note { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px); background: #17171c; border: 1px solid var(--accent-soft); color: var(--ink); font-size: 13px; padding: 13px 20px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .disclaimer-bar { position: relative; z-index: 1; margin-top: 30px; font-size: 11px; color: #66666e; line-height: 1.5; border-top: 1px solid var(--line); padding-top: 16px; }

  @media (max-width: 760px) {
    .logo { font-size: 104px; letter-spacing: -5px; } .subtitle { font-size: 12px; letter-spacing: 6px; }
    .logo-container { height: 210px; } .field select { min-width: 0; width: 78vw; }
    .app { grid-template-columns: 1fr; } .sidebar { display: none; }
    .tiles { grid-template-columns: 1fr 1fr; } .grid-2 { grid-template-columns: 1fr; }
    .workspace { padding: 22px; overflow-x: hidden; }
  }
</style>

<!-- ===================== LANDING ===================== -->
<div class="landing" id="landing">
  <div class="stage" id="stage">
    <div class="logo-container" id="container">
      <div class="logo" id="logo"></div>
      <div class="subtitle" id="subtitle"></div>
      <div class="excavator" id="excavator">
        <div class="cab"></div><div class="boom" id="boom"></div><div class="stick" id="stick"></div><div class="bucket" id="bucket"></div>
      </div>
      <div class="dirt-pile" id="dirt"></div>
      <div class="ground-glow" id="glow"></div>
    </div>
    <div class="controls">
      <div class="field"><label for="tradeSelect">Your trade</label><select id="tradeSelect" aria-label="Select your trade"></select></div>
      <div class="field"><label for="stateSelect">State / territory</label><select id="stateSelect" aria-label="Select your state or territory"></select></div>
    </div>
    <button class="enter-btn" id="enterBtn" type="button" disabled>Enter Workspace &rarr;</button>
    <p class="hint" id="hint">Pick your trade to enter</p>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="brand-mini"><span class="bm-wordmark" id="bmWordmark">EMC</span><span class="bm-sub" id="bmSub">Earth Moving Creations</span></div>
    <button class="nav-item active" data-view="dashboard"><span class="ic">▤</span> Dashboard</button>
    <button class="nav-item" data-view="contracts"><span class="ic">▤</span> Contracts</button>
    <button class="nav-item" data-view="terms"><span class="ic">▤</span> Terms &amp; Conditions</button>
    <button class="nav-item" data-view="claims"><span class="ic">▤</span> Payment Claims</button>
    <button class="nav-item" data-view="disputes"><span class="ic">▤</span> Disputes</button>
    <button class="nav-item" data-view="projects"><span class="ic">▤</span> Projects</button>
    <button class="nav-exit" id="exitApp" type="button">&larr; Back to landing</button>
  </aside>
  <main class="workspace">
    <div class="app-watermark" id="watermark">EMC</div>
    <header class="ws-head">
      <div><h1 id="wsTitle">Dashboard</h1><p class="ws-sub" id="wsContext"></p></div>
      <div class="ctx-chip" id="ctxChip"></div>
    </header>
    <section class="ws-body" id="wsBody"></section>
    <div class="disclaimer-bar">Prototype for demonstration. Not legal advice — document automation and reminders only. Legislation references and statutory timeframes are indicative and pending review by a qualified Australian construction lawyer.</div>
  </main>
</div>

<div class="curtain" id="curtain"></div>
<div class="toast" id="toast"></div>

<script>
  // ============================================================
  // EMC — trade-adaptive contract & dispute protection (prototype)
  // Config below (BRAND / TRADES / JURISDICTIONS) is the adaptable
  // layer; in production it comes from the DB (see docs/schema.sql).
  // ============================================================
  const BRAND = { name:'EMC', wordmark:'EMC', subtitle:'EARTH MOVING CREATIONS', accent:'#ff1a44', logoImage:null };

  const TRADES = [
    {id:'carpentry',name:'Carpentry'},{id:'civil',name:'Civil'},{id:'masonry',name:'Masonry & Bricklaying'},
    {id:'concreting',name:'Concreting'},{id:'earthmoving',name:'Earthmoving & Excavation'},{id:'electrical',name:'Electrical'},
    {id:'plumbing',name:'Plumbing'},{id:'roofing',name:'Roofing'},{id:'steelfixing',name:'Steel Fixing'},
    {id:'plastering',name:'Plastering'},{id:'tiling',name:'Tiling'},{id:'painting',name:'Painting & Decorating'},
    {id:'landscaping',name:'Landscaping'},{id:'demolition',name:'Demolition'},{id:'glazing',name:'Glazing'},
    {id:'hvac',name:'HVAC & Mechanical'}
  ];
  // scheduleDays / adjudicateDays are ILLUSTRATIVE placeholders — verify before use.
  const JURISDICTIONS = [
    {id:'nsw',name:'New South Wales',act:'Building & Construction Industry Security of Payment Act 1999 (NSW)',scheduleDays:10,adjudicateDays:10},
    {id:'vic',name:'Victoria',act:'Building & Construction Industry Security of Payment Act 2002 (Vic)',scheduleDays:10,adjudicateDays:10},
    {id:'qld',name:'Queensland',act:'Building Industry Fairness (Security of Payment) Act 2017 (Qld)',scheduleDays:15,adjudicateDays:30},
    {id:'wa',name:'Western Australia',act:'Building & Construction Industry (Security of Payment) Act 2021 (WA)',scheduleDays:15,adjudicateDays:20},
    {id:'sa',name:'South Australia',act:'Building & Construction Industry Security of Payment Act 2009 (SA)',scheduleDays:15,adjudicateDays:10},
    {id:'tas',name:'Tasmania',act:'Building & Construction Industry Security of Payment Act 2009 (Tas)',scheduleDays:10,adjudicateDays:10},
    {id:'act',name:'Australian Capital Territory',act:'Building & Construction Industry (Security of Payment) Act 2009 (ACT)',scheduleDays:10,adjudicateDays:10},
    {id:'nt',name:'Northern Territory',act:'Construction Contracts (Security of Payments) Act 2004 (NT)',scheduleDays:10,adjudicateDays:90}
  ];

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const cLetter = () => $('cLetter');
  const excavator=$('excavator'),boom=$('boom'),stick=$('stick'),bucket=$('bucket'),dirt=$('dirt'),glow=$('glow');
  const stage=$('stage'),landing=$('landing'),app=$('app'),tradeSel=$('tradeSelect'),stateSel=$('stateSelect');
  const enterBtn=$('enterBtn'),hint=$('hint'),curtain=$('curtain'),toast=$('toast');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let entering=false, ctx=null, terms=null;

  function applyBrand(){
    root.style.setProperty('--accent', BRAND.accent);
    $('subtitle').textContent = BRAND.subtitle;
    const w=BRAND.wordmark, head=w.slice(0,-1), last=w.slice(-1);
    $('logo').innerHTML = head + '<span class="c-letter" id="cLetter">'+last+'</span>';
    $('bmWordmark').textContent = BRAND.wordmark;
    $('bmSub').textContent = BRAND.subtitle;
    $('watermark').textContent = BRAND.wordmark;
  }
  function fillSelects(){
    tradeSel.innerHTML = '<option value="" selected disabled>— Select your trade —</option>' +
      TRADES.map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('');
    stateSel.innerHTML = JURISDICTIONS.map(j=>'<option value="'+j.id+'"'+(j.id==='nsw'?' selected':'')+'>'+j.name+'</option>').join('');
  }
  tradeSel.addEventListener('change', ()=>{
    const ok=!!tradeSel.value; enterBtn.disabled=!ok;
    hint.textContent = ok ? 'Tap to enter your workspace' : 'Pick your trade to enter';
  });

  /* ---------- landing animation ---------- */
  const T={drop:1200,excavatorIn:800,pickup:900,place:1100,excavatorOut:700,settle:1400};
  const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
  const setT=(el,t)=>{el.style.transform=t;};
  function resetAll(){const c=cLetter();c.style.transition='none';c.style.transform='translate(0,0) rotate(0deg)';c.style.opacity='1';
    excavator.style.transition='none';excavator.style.opacity='0';excavator.style.top='-160px';excavator.style.left='58%';
    boom.style.transform=stick.style.transform=bucket.style.transform='rotate(0deg)';bucket.classList.remove('has-load');
    dirt.style.transition='none';dirt.style.transform='translateX(-50%) scale(0)';dirt.style.opacity='0';glow.style.opacity='0';void c.offsetWidth;}
  async function runCycle(){
    if(entering||!landing || landing.classList.contains('hidden'))return;
    const c=cLetter();resetAll();
    c.style.transition='transform 1.1s cubic-bezier(0.55,0.05,0.65,0.9), opacity 0.8s ease';await sleep(50);
    setT(c,'translate(8px, 158px) rotate(28deg)');c.style.opacity='0.85';await sleep(T.drop);
    excavator.style.transition='top 0.7s cubic-bezier(0.22,1,0.36,1), opacity 0.5s ease';excavator.style.opacity='1';excavator.style.top='10px';await sleep(T.excavatorIn);
    glow.style.transition='opacity 0.4s';glow.style.opacity='1';
    dirt.style.transition='transform 0.6s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s';dirt.style.opacity='1';dirt.style.transform='translateX(-50%) scale(1)';
    for(let i=0;i<3;i++){boom.style.transition=stick.style.transition=bucket.style.transition='transform 0.28s ease-in';
      setT(boom,'rotate(18deg)');setT(stick,'rotate(25deg)');setT(bucket,'rotate(35deg)');await sleep(280);
      boom.style.transition=stick.style.transition=bucket.style.transition='transform 0.22s ease-out';
      setT(boom,'rotate(-5deg)');setT(stick,'rotate(-8deg)');setT(bucket,'rotate(-10deg)');await sleep(220);}
    bucket.classList.add('has-load');c.style.transition='transform 0.7s cubic-bezier(0.25,0.8,0.25,1), opacity 0.3s';
    setT(c,'translate(55px, 55px) rotate(-15deg)');c.style.opacity='1';await sleep(T.pickup);
    excavator.style.transition='top 0.6s ease';excavator.style.top='-30px';setT(c,'translate(55px, -40px) rotate(0deg)');await sleep(600);
    excavator.style.transition='top 0.8s cubic-bezier(0.4,0,0.2,1), left 0.8s ease';excavator.style.top='10px';excavator.style.left='50%';
    c.style.transition='transform 0.85s cubic-bezier(0.4,0,0.2,1)';setT(c,'translate(0,0) rotate(0deg)');await sleep(T.place);
    bucket.classList.remove('has-load');c.style.transition='none';setT(c,'translate(0,0) rotate(0deg)');c.style.opacity='1';
    dirt.style.transition='opacity 0.5s, transform 0.5s';dirt.style.opacity='0';dirt.style.transform='translateX(-50%) scale(0.3)';glow.style.opacity='0';
    excavator.style.transition='top 0.7s ease, opacity 0.5s ease';excavator.style.top='-160px';excavator.style.opacity='0';await sleep(T.excavatorOut);
    await sleep(T.settle);runCycle();
  }

  /* ---------- enter / exit ---------- */
  function buildContext(){
    ctx = { trade: TRADES.find(t=>t.id===tradeSel.value), juris: JURISDICTIONS.find(j=>j.id===stateSel.value) };
    terms = null; // reseed terms for the chosen jurisdiction
  }
  function showApp(){
    landing.classList.add('hidden');
    app.classList.remove('hidden');
    void app.offsetWidth;
    app.classList.add('show');
    setView('dashboard');
  }
  function enter(){
    if(entering||enterBtn.disabled)return; entering=true; stage.classList.add('entering');
    buildContext();
    const reveal=()=>{ showApp(); curtain.classList.remove('show'); };
    if(reduceMotion){ curtain.classList.add('show'); setTimeout(reveal,300); return; }
    setTimeout(()=>curtain.classList.add('show'),700);
    setTimeout(reveal,1250);
  }
  function exitApp(){
    curtain.classList.add('show');
    setTimeout(()=>{
      app.classList.remove('show'); app.classList.add('hidden');
      landing.classList.remove('hidden'); stage.classList.remove('entering');
      entering=false; curtain.classList.remove('show');
      if(!reduceMotion) runCycle();
    }, 500);
  }

  function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>toast.classList.remove('show'),2600); }

  /* ---------- app views (scoped to ctx.trade + ctx.juris) ---------- */
  const money = (n)=>'$'+n.toLocaleString('en-AU');
  function setView(view){
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
    const t=ctx.trade.name, j=ctx.juris;
    $('wsContext').textContent = t + ' · ' + j.name;
    $('ctxChip').innerHTML = 'Scoped to <b>'+t+'</b> · <b>'+j.name+'</b><br><span style="color:var(--muted)">'+j.act+'</span>';
    const titles={dashboard:'Dashboard',contracts:'Contracts',terms:'Terms & Conditions',claims:'Payment Claims',disputes:'Disputes',projects:'Projects'};
    $('wsTitle').textContent = titles[view];
    $('wsBody').innerHTML = VIEWS[view](t,j);
    if(view==='terms') renderTerms();
    document.querySelector('.workspace').scrollTop=0;
  }
  const VIEWS = {
    dashboard:(t,j)=>`
      <div class="callout"><div class="k">Next statutory deadline</div>
        <p>Payment claim <b>#PC-1042</b> served on a ${t} package — a payment schedule is due from the respondent within
        <b>${j.scheduleDays} business days</b> under the ${j.act}. Miss it and you may be entitled to the full claimed amount.</p></div>
      <div class="tiles">
        <div class="tile"><div class="k">Open claims</div><div class="v">3</div></div>
        <div class="tile"><div class="k">Outstanding</div><div class="v accent">${money(148250)}</div></div>
        <div class="tile"><div class="k">Deadlines &lt; 7 days</div><div class="v">2</div></div>
        <div class="tile"><div class="k">Active disputes</div><div class="v">1</div></div>
      </div>
      <div class="grid-2">
        <div class="card"><h3>Recent activity</h3><div class="desc">Latest events across your ${t} jobs.</div>
          <div class="clause"><div><div class="name">Payment claim #PC-1042 served</div><div class="note">Skyline Towers · today</div></div><span class="pill warn">Awaiting schedule</span></div>
          <div class="clause"><div><div class="name">Variation dispute opened</div><div class="note">Riverside Estate · 2 days ago</div></div><span class="pill bad">Action needed</span></div>
          <div class="clause"><div><div class="name">Claim #PC-1039 paid in full</div><div class="note">Metro Depot · 5 days ago</div></div><span class="pill good">Paid</span></div>
        </div>
        <div class="card"><h3>Get paid faster</h3><div class="desc">Common next steps for a ${t} subcontractor in ${j.name}.</div>
          <div class="row-actions"><button class="btn" onclick="act('claim')">New payment claim</button><button class="btn ghost" onclick="act('dispute')">Log a dispute</button></div>
          <div style="height:14px"></div>
          <div class="clause"><div class="name">Draft a ${t} subcontract</div><span class="pill mute">Template ready</span></div>
          <div class="clause"><div class="name">Check a contract for unfair terms</div><span class="pill mute">Clause scan</span></div>
        </div>
      </div>`,
    contracts:(t,j)=>`
      <div class="card"><h3>${t} contract templates · ${j.name}</h3><div class="desc">Assembled from the clause library and aligned to the ${j.act}.</div>
        <div class="clause"><div><div class="name">${t} Subcontract Agreement</div><div class="note">Head contractor ↔ subcontractor · ${j.name}</div></div><button class="btn ghost" onclick="act('template')">Use</button></div>
        <div class="clause"><div><div class="name">${t} Quotation &amp; Terms</div><div class="note">Fixed-price with correct payment terms</div></div><button class="btn ghost" onclick="act('template')">Use</button></div>
        <div class="clause"><div><div class="name">Short-form Works Order</div><div class="note">Small jobs · fast turnaround</div></div><button class="btn ghost" onclick="act('template')">Use</button></div>
      </div>
      <div class="card"><h3>Clause library — risk flags</h3><div class="desc">Plain-language warnings on terms that commonly sting subbies.</div>
        <div class="clause"><div><div class="name">Pay-when-paid clause</div><div class="note">Often unenforceable under security of payment law</div></div><span class="pill bad">High risk</span></div>
        <div class="clause"><div><div class="name">Short time-bar on variations</div><div class="note">Claim variations promptly or lose them</div></div><span class="pill warn">Watch</span></div>
        <div class="clause"><div><div class="name">Retention &amp; release terms</div><div class="note">Ensure retention is returned on time</div></div><span class="pill warn">Watch</span></div>
        <div class="clause"><div><div class="name">Standard payment terms</div><div class="note">Aligned to ${j.name} statutory timeframes</div></div><span class="pill good">OK</span></div>
      </div>`,
    terms:(t,j)=>`
      <div class="callout"><div class="k">AI terms &amp; conditions builder</div>
        <p>Type a plain-English term you want to add. It is drafted into a formal clause aligned to <b>${j.name}</b> and the ${j.act}, then added to your set below.
        <i>(Prototype: drafting runs locally as a placeholder — in production this calls your AI endpoint with the jurisdiction and trade as context. Always have terms reviewed by a lawyer.)</i></p></div>
      <div class="card"><h3>Add a term</h3>
        <div class="desc">e.g. &ldquo;48 hours notice required for site access&rdquo;, &ldquo;progress claims submitted monthly&rdquo;, &ldquo;retention released within 90 days of practical completion&rdquo;.</div>
        <textarea id="termInput" rows="3" placeholder="Describe the term you want to add…" style="width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:14px;padding:12px;resize:vertical;font-family:inherit"></textarea>
        <div class="row-actions" style="margin-top:12px"><button class="btn" onclick="generateTerm()">Draft with AI</button><button class="btn ghost" onclick="downloadTerms()">Download terms</button></div>
      </div>
      <div class="card"><h3>Your terms &amp; conditions</h3><div class="desc">Scoped to ${t} · ${j.name}.</div><div id="termsList"></div></div>`,
    claims:(t,j)=>`
      <div class="callout"><div class="k">How deadlines work here</div>
        <p>In ${j.name}, once you serve a payment claim the respondent generally must reply with a payment schedule within
        <b>${j.scheduleDays} business days</b>; an adjudication application window of about <b>${j.adjudicateDays} business days</b> then applies.
        The app tracks these dates for every claim. <i>(Timeframes indicative — pending legal review.)</i></p></div>
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3 style="margin:0">Payment claims</h3><button class="btn" onclick="act('claim')">+ New payment claim</button></div>
        <table class="data"><thead><tr><th>Ref</th><th>Project</th><th>Amount</th><th>Served</th><th>Schedule due</th><th>Status</th></tr></thead><tbody>
          <tr><td>PC-1042</td><td>Skyline Towers</td><td>${money(86500)}</td><td>Today</td><td>+${j.scheduleDays} days</td><td><span class="pill warn">Awaiting schedule</span></td></tr>
          <tr><td>PC-1041</td><td>Riverside Estate</td><td>${money(42750)}</td><td>6 days ago</td><td>Overdue</td><td><span class="pill bad">Escalate</span></td></tr>
          <tr><td>PC-1039</td><td>Metro Depot</td><td>${money(19000)}</td><td>12 days ago</td><td>—</td><td><span class="pill good">Paid</span></td></tr>
        </tbody></table></div>`,
    disputes:(t,j)=>`
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3 style="margin:0">Disputes · ${j.name}</h3><button class="btn" onclick="act('dispute')">+ New dispute</button></div>
        <div class="desc">Deadline-aware tracking under the ${j.act}.</div>
        <div class="clause"><div><div class="name">Unpaid variation — extra ${t} works</div><div class="note">Riverside Estate · ${money(28400)} · next action in 4 days</div></div><span class="pill bad">Adjudication window</span></div>
        <div class="clause"><div><div class="name">Back-charge disputed</div><div class="note">Skyline Towers · ${money(6200)} · negotiating</div></div><span class="pill warn">Negotiating</span></div>
        <div class="clause"><div><div class="name">Defect claim — resolved</div><div class="note">Metro Depot · closed last week</div></div><span class="pill good">Resolved</span></div>
      </div>
      <div class="card"><h3>Start a dispute</h3><div class="desc">Pick a category and the intake wizard builds a deadline-aware timeline and the right documents for ${j.name}.</div>
        <div class="row-actions" style="flex-wrap:wrap">
          <button class="btn ghost" onclick="act('dispute')">Non-payment</button><button class="btn ghost" onclick="act('dispute')">Variation</button>
          <button class="btn ghost" onclick="act('dispute')">Back-charge</button><button class="btn ghost" onclick="act('dispute')">Defect</button>
          <button class="btn ghost" onclick="act('dispute')">Termination</button></div></div>`,
    projects:(t,j)=>`
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3 style="margin:0">Project register</h3><button class="btn" onclick="act('project')">+ New project</button></div>
        <table class="data"><thead><tr><th>Project</th><th>Head contractor</th><th>Value</th><th>Start</th><th>Status</th></tr></thead><tbody>
          <tr><td>Skyline Towers</td><td>Apex Constructions</td><td>${money(310000)}</td><td>Mar 2026</td><td><span class="pill good">Active</span></td></tr>
          <tr><td>Riverside Estate</td><td>Delta Developments</td><td>${money(174500)}</td><td>Jan 2026</td><td><span class="pill warn">Dispute</span></td></tr>
          <tr><td>Metro Depot</td><td>Civic Builders</td><td>${money(96000)}</td><td>Nov 2025</td><td><span class="pill mute">Completed</span></td></tr>
        </tbody></table></div>`
  };
  window.act = (kind)=>{
    const map={claim:'payment-claim form',dispute:'dispute intake wizard',template:'contract builder',project:'new-project form'};
    showToast('Prototype — this is where the '+(map[kind]||'feature')+' opens.');
  };

  /* ---------- Terms & Conditions builder ---------- */
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function seedTerms(){
    if(terms) return;
    terms = [
      { title:'Governing law', body:'This agreement is governed by the laws of '+ctx.juris.name+', Australia. The parties acknowledge the operation of the '+ctx.juris.act+'.' },
      { title:'Payment terms', body:'Progress claims may be submitted monthly. Following a payment claim, the respondent must provide a payment schedule within '+ctx.juris.scheduleDays+' business days, consistent with the '+ctx.juris.act+'. Nothing in this contract excludes, modifies or restricts any entitlement under that Act.' }
    ];
  }
  // PROTOTYPE stand-in for the AI call. In production, POST { input, trade, jurisdiction }
  // to your model endpoint (e.g. the Claude API) and use its drafted clause here.
  function draftClause(input, trade, juris){
    const clean = input.trim().replace(/\s+/g,' ');
    const title = (clean.split(' ').slice(0,6).join(' ')).replace(/[.,:;]+$/,'') || 'Additional term';
    const body = 'The parties agree as follows: '+clean+(/[.!?]$/.test(clean)?'':'.')+
      ' This term applies to the '+trade+' works under this contract and is to be read consistently with the '+juris.act+
      '. Nothing in this term operates to exclude, modify or restrict any entitlement the subcontractor has under that Act.';
    return { title: title.charAt(0).toUpperCase()+title.slice(1), body, ai:true };
  }
  window.generateTerm = function(){
    const el=document.getElementById('termInput'); if(!el) return;
    const v=el.value.trim();
    if(!v){ showToast('Type the term you want to add first.'); return; }
    seedTerms(); terms.push(draftClause(v, ctx.trade.name, ctx.juris));
    el.value=''; renderTerms(); showToast('Drafted and added — review before use.');
  };
  window.removeTerm = function(i){ terms.splice(i,1); renderTerms(); };
  function renderTerms(){
    const list=document.getElementById('termsList'); if(!list) return; seedTerms();
    if(!terms.length){ list.innerHTML='<div class="desc">No terms yet — add one above.</div>'; return; }
    list.innerHTML = terms.map((tm,i)=>
      '<div style="padding:14px 0;border-bottom:1px solid #202026">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">'+
          '<div style="font-weight:700;font-size:13.5px">'+(i+1)+'. '+esc(tm.title)+(tm.ai?' <span class="pill mute" style="margin-left:6px">AI draft</span>':'')+'</div>'+
          '<button class="btn ghost" style="padding:6px 12px" onclick="removeTerm('+i+')">Remove</button>'+
        '</div>'+
        '<p style="color:var(--silver);font-size:13px;line-height:1.6;margin-top:8px">'+esc(tm.body)+'</p>'+
      '</div>').join('');
  }
  window.downloadTerms = async function(){
    seedTerms();
    const header = BRAND.name+' — Terms & Conditions\n'+ctx.trade.name+' · '+ctx.juris.name+'\n'+ctx.juris.act+'\n\n';
    const text = header + terms.map((tm,i)=>(i+1)+'. '+tm.title+'\n'+tm.body).join('\n\n') +
      '\n\n---\nPrototype draft. Not legal advice — review with a qualified Australian construction lawyer.';
    const filename = (BRAND.name+'-terms-'+ctx.juris.id+'.txt').toLowerCase();
    try {
      if (window.claude && window.claude.downloads) { await window.claude.downloads.save({ filename, data: text }); showToast('Saved.'); }
      else { const blob=new Blob([text],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); URL.revokeObjectURL(a.href); showToast('Downloaded.'); }
    } catch(e){ if(!(e && e.code==='declined')) showToast('Download unavailable here.'); }
  };

  document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
  enterBtn.addEventListener('click', enter);
  $('exitApp').addEventListener('click', exitApp);

  applyBrand(); fillSelects();
  window.addEventListener('load', ()=>{ if(reduceMotion) return; setTimeout(runCycle,600); });
</script>
</body>
</html>
