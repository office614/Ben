<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Welding & Fabrication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --accent: #d97706;
            --accent-light: #f97316;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .splash-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            z-index: 1;
        }

        .glow-effect {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, transparent 70%);
            animation: glow-pulse 4s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .splash-content {
            position: relative;
            z-index: 3;
            text-align: center;
            animation: fade-in 1.5s ease-out;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-splash {
            width: 200px;
            height: 200px;
            margin: 0 auto 3rem;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(249, 115, 22, 0.4));
            animation: logo-spin 6s linear infinite;
        }

        @keyframes logo-spin {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
        }

        .splash-title {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 300;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 1rem;
            text-shadow: 0 0 40px rgba(249, 115, 22, 0.3);
        }

        .splash-subtitle {
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            letter-spacing: 2px;
            color: var(--accent-light);
            text-transform: uppercase;
            margin-bottom: 4rem;
            text-shadow: 0 0 20px rgba(249, 115, 22, 0.4);
        }

        .enter-portal {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(249, 115, 22, 0.8), rgba(217, 119, 6, 0.4));
            border: 2px solid var(--accent-light);
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(249, 115, 22, 0.5), inset 0 0 30px rgba(249, 115, 22, 0.2);
            position: relative;
            overflow: hidden;
            animation: button-pulse-splash 2.5s ease-in-out infinite;
        }

        @keyframes button-pulse-splash {
            0%, 100% {
                box-shadow: 0 0 40px rgba(249, 115, 22, 0.5), inset 0 0 30px rgba(249, 115, 22, 0.2);
            }
            50% {
                box-shadow: 0 0 60px rgba(249, 115, 22, 0.8), inset 0 0 40px rgba(249, 115, 22, 0.4);
            }
        }

        .enter-portal:hover {
            transform: scale(1.1);
            box-shadow: 0 0 80px rgba(249, 115, 22, 0.9), inset 0 0 50px rgba(249, 115, 22, 0.5);
        }

        .enter-portal:active {
            transform: scale(0.95);
        }

        .portal-icon {
            font-size: 3rem;
            color: #ffffff;
            text-shadow: 0 0 20px var(--accent-light);
            animation: icon-float 2s ease-in-out infinite;
        }

        @keyframes icon-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .tagline {
            position: absolute;
            bottom: 3rem;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .logo-splash {
                width: 120px;
                height: 120px;
                margin-bottom: 2rem;
            }

            .enter-portal {
                width: 90px;
                height: 90px;
            }

            .portal-icon {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="splash-background"></div>
        <div class="glow-effect"></div>

        <div class="splash-content">
            <img src="assets/logo-small.png" alt="Diamond" class="logo-splash">
            <h1 class="splash-title">Diamond</h1>
            <p class="splash-subtitle">Welding & Fabrication</p>
            <div class="enter-portal" onclick="enterSite()">
                <span class="portal-icon">→</span>
            </div>
        </div>

        <div class="tagline">Brilliance by Design</div>
    </div>

    <script>
        function enterSite() {
            window.location.href = 'portfolio.html';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                enterSite();
            }
        });
    </script>
</body>
</html>
