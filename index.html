<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMC – Earth Moving Creations</title>
</head>
<body>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(ellipse at center, #0e0e11 0%, #050506 72%, #000 100%);
    font-family: 'Arial Black', Impact, 'Arial', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---- centered stack: animation + entry button ---- */
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    z-index: 2;
  }

  .logo-container {
    position: relative;
    width: 760px;
    height: 320px;
    max-width: 100vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  .logo {
    font-size: 176px;
    font-weight: 900;
    color: #ff1a44;
    text-shadow:
      0 0 1px #ff8095,
      0 0 6px #ff0033,
      0 0 14px #ff0033,
      0 0 30px rgba(255, 0, 51, 0.65);
    letter-spacing: -8px;
    position: relative;
    z-index: 5;
    line-height: 1;
  }

  .c-letter {
    display: inline-block;
    position: relative;
    transition: none;
    transform-origin: center bottom;
    will-change: transform, opacity;
  }

  .subtitle {
    margin-top: 12px;
    font-size: 18px;
    color: #c0c0c0;
    letter-spacing: 10px;
    font-weight: 400;
    text-transform: uppercase;
    font-family: Arial, Helvetica, sans-serif;
    text-shadow: 0 0 8px rgba(192, 192, 192, 0.4);
    z-index: 5;
  }

  /* Excavator */
  .excavator {
    position: absolute;
    width: 160px;
    height: 140px;
    top: -160px;
    left: 58%;
    transform: translateX(-50%);
    opacity: 0;
    z-index: 10;
    pointer-events: none;
    transition: none;
  }
  .cab {
    width: 70px; height: 45px;
    background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
    border: 3px solid #666; border-radius: 6px 6px 2px 2px;
    position: absolute; top: 0; left: 20px;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.15);
  }
  .cab::after {
    content: ''; position: absolute; top: 8px; left: 10px;
    width: 45px; height: 18px; background: #1a3a5c;
    border: 2px solid #333; border-radius: 2px;
  }
  .boom {
    width: 12px; height: 70px;
    background: linear-gradient(90deg, #555, #333);
    position: absolute; top: 30px; left: 55px;
    transform-origin: top center; border-radius: 2px;
  }
  .stick {
    width: 10px; height: 55px;
    background: linear-gradient(90deg, #555, #333);
    position: absolute; top: 90px; left: 56px;
    transform-origin: top center; border-radius: 2px;
  }
  .bucket {
    width: 55px; height: 35px;
    background: linear-gradient(180deg, #3a3a3a, #1a1a1a);
    border: 3px solid #555; border-radius: 0 0 8px 8px;
    position: absolute; top: 135px; left: 35px;
    transform-origin: top center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
  }
  .bucket::before {
    content: ''; position: absolute; bottom: -8px; left: 4px; right: 4px;
    height: 10px;
    background: repeating-linear-gradient(90deg, #222 0 8px, transparent 8px 12px);
  }
  .bucket::after {
    content: ''; position: absolute; bottom: 4px; left: 6px; right: 6px;
    height: 14px;
    background: linear-gradient(to bottom, #ff6600, #cc2200);
    border-radius: 0 0 4px 4px;
    box-shadow: 0 0 12px #ff4400, 0 0 24px #ff2200;
    opacity: 0; transition: opacity 0.3s;
  }
  .bucket.has-load::after { opacity: 1; }

  /* Dirt / ground pile */
  .dirt-pile {
    position: absolute; width: 90px; height: 35px;
    background: radial-gradient(ellipse at center, #5a3a1a 0%, #3a2510 70%, transparent 100%);
    border-radius: 50%; bottom: 40px; left: 58%;
    transform: translateX(-50%) scale(0);
    opacity: 0; z-index: 3;
    box-shadow: 0 0 20px rgba(255, 80, 0, 0.3);
  }
  .ground-glow {
    position: absolute; width: 200px; height: 60px;
    background: radial-gradient(ellipse at center, rgba(255, 60, 0, 0.25) 0%, transparent 70%);
    bottom: 20px; left: 58%; transform: translateX(-50%);
    opacity: 0; z-index: 1; pointer-events: none;
  }

  /* ---- entry button + hint ---- */
  .enter-btn {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: #c9ccd1;
    background: rgba(20,20,22,0.72);
    border: 1.5px solid rgba(255,31,61,0.6);
    border-radius: 999px;
    padding: 15px 34px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,31,61,0.28);
    transition: background 0.25s, color 0.25s, box-shadow 0.25s, transform 0.15s;
    animation: btnPulse 2.8s ease-in-out infinite;
  }
  .enter-btn:hover,
  .enter-btn:focus-visible {
    background: rgba(255,31,61,0.95);
    color: #fff;
    box-shadow: 0 0 34px rgba(255,31,61,0.65);
    outline: none;
    animation: none;
  }
  .enter-btn:active { transform: scale(0.97); }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 0 16px rgba(255,31,61,0.22); }
    50%     { box-shadow: 0 0 34px rgba(255,31,61,0.55); }
  }

  .hint {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: #6a6a70; margin-top: -14px;
    animation: hintPulse 2.6s ease-in-out infinite;
  }
  @keyframes hintPulse { 0%,100%{opacity:0.35} 50%{opacity:0.85} }

  /* ---- enter transition ---- */
  .stage.entering .enter-btn,
  .stage.entering .hint { animation: fadeOut 0.35s forwards; pointer-events: none; }
  @keyframes fadeOut { to { opacity: 0; } }

  .curtain {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #170406 0%, #000 82%);
    opacity: 0; pointer-events: none;
    transition: opacity 0.7s ease; z-index: 9;
  }
  .curtain.show { opacity: 1; }

  .arrive {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease 0.15s; z-index: 10;
  }
  .arrive.show { opacity: 1; pointer-events: auto; }
  .arrive-inner { max-width: 460px; }
  .arrive h2 {
    font-family: 'Arial Black', Arial, sans-serif;
    color: #ff1f3d; letter-spacing: 1px; font-size: 22px; margin-bottom: 10px;
    text-shadow: 0 0 18px rgba(255,31,61,0.5);
  }
  .arrive p {
    font-family: Arial, Helvetica, sans-serif;
    color: #9a9aa0; font-size: 14px; line-height: 1.6; margin-bottom: 22px;
  }
  .replay {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: #c9ccd1; background: none; border: 1px solid #444; border-radius: 999px;
    padding: 10px 22px; cursor: pointer; transition: border-color .2s, color .2s;
  }
  .replay:hover { border-color: #ff1f3d; color: #fff; }

  @media (max-width: 520px) {
    .logo { font-size: 112px; letter-spacing: -5px; }
    .subtitle { font-size: 13px; letter-spacing: 6px; }
    .logo-container { height: 240px; }
  }
</style>

<div class="stage" id="stage">
  <div class="logo-container" id="container" role="button" tabindex="0" aria-label="Enter the EMC Contract App">
    <div class="logo" id="logo">EM<span class="c-letter" id="cLetter">C</span></div>
    <div class="subtitle">EARTH MOVING CREATIONS</div>

    <div class="excavator" id="excavator">
      <div class="cab"></div>
      <div class="boom" id="boom"></div>
      <div class="stick" id="stick"></div>
      <div class="bucket" id="bucket"></div>
    </div>

    <div class="dirt-pile" id="dirt"></div>
    <div class="ground-glow" id="glow"></div>
  </div>

  <button class="enter-btn" id="enterBtn" type="button">Enter Contract App &rarr;</button>
  <p class="hint" id="hint">Tap to enter</p>
</div>

<div class="curtain" id="curtain"></div>
<div class="arrive" id="arrive">
  <div class="arrive-inner">
    <h2>Entering the Contract App&hellip;</h2>
    <p>This is where your contract app loads. Add its web address and the button hands off straight into it.</p>
    <button class="replay" id="replay" type="button">Back to animation</button>
  </div>
</div>

<script>
  // ============================================================
  // EMC landing page — looping excavator animation behind a
  // centered entry button. Press to enter the contract app.
  // ============================================================

  // Replace with your contract app's live URL and the button will redirect into it.
  const APP_URL = "https://REPLACE-WITH-CONTRACT-APP-URL";

  const cLetter   = document.getElementById('cLetter');
  const excavator = document.getElementById('excavator');
  const boom      = document.getElementById('boom');
  const stick     = document.getElementById('stick');
  const bucket    = document.getElementById('bucket');
  const dirt      = document.getElementById('dirt');
  const glow      = document.getElementById('glow');

  const stage     = document.getElementById('stage');
  const container = document.getElementById('container');
  const enterBtn  = document.getElementById('enterBtn');
  const curtain   = document.getElementById('curtain');
  const arrive    = document.getElementById('arrive');
  const replay    = document.getElementById('replay');

  const reduceMotion  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isPlaceholder = APP_URL.indexOf('REPLACE-WITH') !== -1;
  let entering = false;

  const T = { drop:1200, excavatorIn:800, pickup:900, place:1100, excavatorOut:700, settle:1500 };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const setTransform = (el, t) => { el.style.transform = t; };

  function resetAll() {
    cLetter.style.transition = 'none';
    cLetter.style.transform  = 'translate(0,0) rotate(0deg)';
    cLetter.style.opacity    = '1';
    excavator.style.transition = 'none';
    excavator.style.opacity    = '0';
    excavator.style.top        = '-160px';
    excavator.style.left       = '58%';
    boom.style.transform  = 'rotate(0deg)';
    stick.style.transform = 'rotate(0deg)';
    bucket.style.transform= 'rotate(0deg)';
    bucket.classList.remove('has-load');
    dirt.style.transition = 'none';
    dirt.style.transform  = 'translateX(-50%) scale(0)';
    dirt.style.opacity    = '0';
    glow.style.opacity = '0';
    void cLetter.offsetWidth;
  }

  async function runCycle() {
    if (entering) return;
    resetAll();

    // 1. C drops off the logo
    cLetter.style.transition = 'transform 1.1s cubic-bezier(0.55, 0.05, 0.65, 0.9), opacity 0.8s ease';
    await sleep(50);
    setTransform(cLetter, 'translate(8px, 165px) rotate(28deg)');
    cLetter.style.opacity = '0.85';
    await sleep(T.drop);

    // 2. Excavator enters
    excavator.style.transition = 'top 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease';
    excavator.style.opacity = '1';
    excavator.style.top = '10px';
    await sleep(T.excavatorIn);

    // 3. Digging
    glow.style.transition = 'opacity 0.4s';
    glow.style.opacity = '1';
    dirt.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s';
    dirt.style.opacity = '1';
    dirt.style.transform = 'translateX(-50%) scale(1)';
    for (let i = 0; i < 3; i++) {
      boom.style.transition = stick.style.transition = bucket.style.transition = 'transform 0.28s ease-in';
      setTransform(boom, 'rotate(18deg)'); setTransform(stick, 'rotate(25deg)'); setTransform(bucket, 'rotate(35deg)');
      await sleep(280);
      boom.style.transition = stick.style.transition = bucket.style.transition = 'transform 0.22s ease-out';
      setTransform(boom, 'rotate(-5deg)'); setTransform(stick, 'rotate(-8deg)'); setTransform(bucket, 'rotate(-10deg)');
      await sleep(220);
    }

    // 4. Scoop the C (kept at logo size — no scaling)
    bucket.classList.add('has-load');
    cLetter.style.transition = 'transform 0.7s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s';
    setTransform(cLetter, 'translate(55px, 55px) rotate(-15deg)');
    cLetter.style.opacity = '1';
    await sleep(T.pickup);

    // 5. Lift & place C back exactly
    excavator.style.transition = 'top 0.6s ease';
    excavator.style.top = '-30px';
    setTransform(cLetter, 'translate(55px, -40px) rotate(0deg)');
    await sleep(600);
    excavator.style.transition = 'top 0.8s cubic-bezier(0.4, 0, 0.2, 1), left 0.8s ease';
    excavator.style.top = '10px'; excavator.style.left = '50%';
    cLetter.style.transition = 'transform 0.85s cubic-bezier(0.4, 0, 0.2, 1)';
    setTransform(cLetter, 'translate(0, 0) rotate(0deg)');
    await sleep(T.place);

    bucket.classList.remove('has-load');
    cLetter.style.transition = 'none';
    setTransform(cLetter, 'translate(0,0) rotate(0deg)');
    cLetter.style.opacity = '1';

    // 6. Excavator leaves
    dirt.style.transition = 'opacity 0.5s, transform 0.5s';
    dirt.style.opacity = '0'; dirt.style.transform = 'translateX(-50%) scale(0.3)';
    glow.style.opacity = '0';
    excavator.style.transition = 'top 0.7s ease, opacity 0.5s ease';
    excavator.style.top = '-160px'; excavator.style.opacity = '0';
    await sleep(T.excavatorOut);

    // 7. Hold, then loop
    await sleep(T.settle);
    runCycle();
  }

  // ---- entry handling ----
  function finish() {
    if (isPlaceholder) { arrive.classList.add('show'); }
    else { window.location.href = APP_URL; }
  }
  function enter() {
    if (entering) return;
    entering = true;
    stage.classList.add('entering');
    if (reduceMotion) { curtain.classList.add('show'); setTimeout(finish, 350); return; }
    setTimeout(() => curtain.classList.add('show'), 700);
    setTimeout(finish, 1250);
  }
  function reset() {
    entering = false;
    stage.classList.remove('entering');
    curtain.classList.remove('show');
    arrive.classList.remove('show');
    enterBtn.style.opacity = ''; document.getElementById('hint').style.opacity = '';
    runCycle();
  }

  enterBtn.addEventListener('click', enter);
  container.addEventListener('click', enter);
  container.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); }
  });
  replay.addEventListener('click', reset);

  window.addEventListener('load', () => {
    if (reduceMotion) return;      // honor reduced motion: static logo, button still works
    setTimeout(runCycle, 600);
  });
</script>
</body>
</html>
