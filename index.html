<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMC – EARTH MOVING CREATIONS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      font-family: 'Arial Black', Impact, 'Arial', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .logo-container {
      position: relative;
      width: 700px;
      height: 280px;
      max-width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .logo {
      font-size: 140px;
      font-weight: 900;
      color: #ff0033;
      text-shadow:
        0 0 10px #ff0033,
        0 0 20px #ff0033,
        0 0 40px #ff0033,
        0 0 80px #ff0033,
        0 0 120px #ff0033;
      letter-spacing: -8px;
      position: relative;
      z-index: 5;
      line-height: 1;
    }

    .c-letter {
      display: inline-block;
      position: relative;
      transition: none;
      transform-origin: center bottom;
      will-change: transform, opacity;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 18px;
      color: #c0c0c0;
      letter-spacing: 10px;
      font-weight: 400;
      text-transform: uppercase;
      font-family: Arial, Helvetica, sans-serif;
      text-shadow: 0 0 8px rgba(192, 192, 192, 0.4);
      z-index: 5;
    }

    /* Excavator */
    .excavator {
      position: absolute;
      width: 160px;
      height: 140px;
      top: -160px;
      left: 58%;
      transform: translateX(-50%);
      opacity: 0;
      z-index: 10;
      pointer-events: none;
      transition: none;
    }

    .cab {
      width: 70px;
      height: 45px;
      background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
      border: 3px solid #666;
      border-radius: 6px 6px 2px 2px;
      position: absolute;
      top: 0;
      left: 20px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.15);
    }

    .cab::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 10px;
      width: 45px;
      height: 18px;
      background: #1a3a5c;
      border: 2px solid #333;
      border-radius: 2px;
    }

    .boom {
      width: 12px;
      height: 70px;
      background: linear-gradient(90deg, #555, #333);
      position: absolute;
      top: 30px;
      left: 55px;
      transform-origin: top center;
      border-radius: 2px;
    }

    .stick {
      width: 10px;
      height: 55px;
      background: linear-gradient(90deg, #555, #333);
      position: absolute;
      top: 90px;
      left: 56px;
      transform-origin: top center;
      border-radius: 2px;
    }

    .bucket {
      width: 55px;
      height: 35px;
      background: linear-gradient(180deg, #3a3a3a, #1a1a1a);
      border: 3px solid #555;
      border-radius: 0 0 8px 8px;
      position: absolute;
      top: 135px;
      left: 35px;
      transform-origin: top center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .bucket::before {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 4px;
      right: 4px;
      height: 10px;
      background: repeating-linear-gradient(
        90deg,
        #222 0 8px,
        transparent 8px 12px
      );
    }

    .bucket::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 6px;
      right: 6px;
      height: 14px;
      background: linear-gradient(to bottom, #ff6600, #cc2200);
      border-radius: 0 0 4px 4px;
      box-shadow: 0 0 12px #ff4400, 0 0 24px #ff2200;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .bucket.has-load::after {
      opacity: 1;
    }

    /* Dirt / ground pile */
    .dirt-pile {
      position: absolute;
      width: 90px;
      height: 35px;
      background: radial-gradient(ellipse at center, #5a3a1a 0%, #3a2510 70%, transparent 100%);
      border-radius: 50%;
      bottom: 40px;
      left: 58%;
      transform: translateX(-50%) scale(0);
      opacity: 0;
      z-index: 3;
      box-shadow: 0 0 20px rgba(255, 80, 0, 0.3);
    }

    .ground-glow {
      position: absolute;
      width: 200px;
      height: 60px;
      background: radial-gradient(ellipse at center, rgba(255, 60, 0, 0.25) 0%, transparent 70%);
      bottom: 20px;
      left: 58%;
      transform: translateX(-50%);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .logo { font-size: 92px; letter-spacing: -5px; }
      .subtitle { font-size: 13px; letter-spacing: 6px; }
      .logo-container { height: 220px; }
    }
  </style>
</head>
<body>
  <div class="logo-container" id="container">
    <div class="logo" id="logo">
      EM<span class="c-letter" id="cLetter">C</span>
    </div>
    <div class="subtitle">EARTH MOVING CREATIONS</div>

    <div class="excavator" id="excavator">
      <div class="cab"></div>
      <div class="boom" id="boom"></div>
      <div class="stick" id="stick"></div>
      <div class="bucket" id="bucket"></div>
    </div>

    <div class="dirt-pile" id="dirt"></div>
    <div class="ground-glow" id="glow"></div>
  </div>

  <script>
    // ============================================================
    // EMC Logo Animation
    // First frame === last frame (perfect loop)
    // C drops → excavator digs it out of the ground → places C back
    // Logo design, size, font & letter shape NEVER change
    // ============================================================

    const cLetter   = document.getElementById('cLetter');
    const excavator = document.getElementById('excavator');
    const boom      = document.getElementById('boom');
    const stick     = document.getElementById('stick');
    const bucket    = document.getElementById('bucket');
    const dirt      = document.getElementById('dirt');
    const glow      = document.getElementById('glow');

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const T = {
      drop:         1200,
      excavatorIn:  800,
      dig:          1800,
      pickup:       900,
      place:        1100,
      excavatorOut: 700,
      settle:       1500
    };

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    function setTransform(el, t) {
      el.style.transform = t;
    }

    function resetAll() {
      // Exact starting state (first = last frame)
      cLetter.style.transition = 'none';
      cLetter.style.transform  = 'translate(0,0) rotate(0deg)';
      cLetter.style.opacity    = '1';

      excavator.style.transition = 'none';
      excavator.style.opacity    = '0';
      excavator.style.top        = '-160px';
      excavator.style.left       = '58%';

      boom.style.transform  = 'rotate(0deg)';
      stick.style.transform = 'rotate(0deg)';
      bucket.style.transform= 'rotate(0deg)';
      bucket.classList.remove('has-load');

      dirt.style.transition = 'none';
      dirt.style.transform  = 'translateX(-50%) scale(0)';
      dirt.style.opacity    = '0';

      glow.style.opacity = '0';

      void cLetter.offsetWidth; // force reflow
    }

    async function runCycle() {
      resetAll();

      // 1. C drops off the logo
      cLetter.style.transition = 'transform 1.1s cubic-bezier(0.55, 0.05, 0.65, 0.9), opacity 0.8s ease';
      await sleep(50);
      setTransform(cLetter, 'translate(8px, 165px) rotate(28deg)');
      cLetter.style.opacity = '0.85';
      await sleep(T.drop);

      // 2. Excavator enters
      excavator.style.transition = 'top 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease';
      excavator.style.opacity = '1';
      excavator.style.top = '10px';
      await sleep(T.excavatorIn);

      // 3. Digging (realistic arm motion + dirt)
      glow.style.transition = 'opacity 0.4s';
      glow.style.opacity = '1';
      dirt.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s';
      dirt.style.opacity = '1';
      dirt.style.transform = 'translateX(-50%) scale(1)';

      for (let i = 0; i < 3; i++) {
        boom.style.transition  = 'transform 0.28s ease-in';
        stick.style.transition = 'transform 0.28s ease-in';
        bucket.style.transition= 'transform 0.28s ease-in';
        setTransform(boom,  'rotate(18deg)');
        setTransform(stick, 'rotate(25deg)');
        setTransform(bucket,'rotate(35deg)');
        await sleep(280);

        boom.style.transition  = 'transform 0.22s ease-out';
        stick.style.transition = 'transform 0.22s ease-out';
        bucket.style.transition= 'transform 0.22s ease-out';
        setTransform(boom,  'rotate(-5deg)');
        setTransform(stick, 'rotate(-8deg)');
        setTransform(bucket,'rotate(-10deg)');
        await sleep(220);
      }

      // 4. Scoop the C
      bucket.classList.add('has-load');
      cLetter.style.transition = 'transform 0.7s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s';
      setTransform(cLetter, 'translate(55px, 55px) rotate(-15deg) scale(0.85)');
      cLetter.style.opacity = '1';
      await sleep(T.pickup);

      // 5. Lift & place C back exactly
      excavator.style.transition = 'top 0.6s ease';
      excavator.style.top = '-30px';
      setTransform(cLetter, 'translate(55px, -40px) rotate(0deg) scale(0.9)');
      await sleep(600);

      excavator.style.transition = 'top 0.8s cubic-bezier(0.4, 0, 0.2, 1), left 0.8s ease';
      excavator.style.top  = '10px';
      excavator.style.left = '50%';

      cLetter.style.transition = 'transform 0.85s cubic-bezier(0.4, 0, 0.2, 1)';
      setTransform(cLetter, 'translate(0, 0) rotate(0deg) scale(1)');
      await sleep(T.place);

      // Detach – C is now perfectly back
      bucket.classList.remove('has-load');
      cLetter.style.transition = 'none';
      setTransform(cLetter, 'translate(0,0) rotate(0deg)');
      cLetter.style.opacity = '1';

      // 6. Excavator leaves
      dirt.style.transition = 'opacity 0.5s, transform 0.5s';
      dirt.style.opacity = '0';
      dirt.style.transform = 'translateX(-50%) scale(0.3)';
      glow.style.opacity = '0';

      excavator.style.transition = 'top 0.7s ease, opacity 0.5s ease';
      excavator.style.top = '-160px';
      excavator.style.opacity = '0';
      await sleep(T.excavatorOut);

      // 7. Hold perfect final frame (identical to start)
      await sleep(T.settle);

      // Seamless loop
      runCycle();
    }

    window.addEventListener('load', () => {
      if (reduceMotion) {
        // Honor reduced-motion: show the finished logo, no looping animation.
        return;
      }
      setTimeout(runCycle, 800);
    });
  </script>
</body>
</html>
