<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMC – Trade Contract & Dispute Protection</title>
</head>
<body>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  :root {
    --accent: #ff1a44;                 /* white-label hook: set from BRAND.accent */
    --accent-soft: color-mix(in srgb, var(--accent) 55%, transparent);
    --accent-faint: color-mix(in srgb, var(--accent) 25%, transparent);
    --silver: #c9ccd1;
    --panel: rgba(20,20,22,0.72);
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(ellipse at center, #0e0e11 0%, #050506 72%, #000 100%);
    font-family: 'Arial Black', Impact, 'Arial', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    z-index: 2;
    padding: 16px;
  }

  .logo-container {
    position: relative;
    width: 760px;
    height: 300px;
    max-width: 100vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .logo {
    font-size: 168px;
    font-weight: 900;
    color: var(--accent);
    text-shadow:
      0 0 1px #ffd0d8,
      0 0 6px var(--accent),
      0 0 14px var(--accent),
      0 0 30px var(--accent-soft);
    letter-spacing: -8px;
    position: relative;
    z-index: 5;
    line-height: 1;
  }
  .c-letter {
    display: inline-block;
    position: relative;
    transition: none;
    transform-origin: center bottom;
    will-change: transform, opacity;
  }
  .subtitle {
    margin-top: 12px;
    font-size: 17px;
    color: var(--silver);
    letter-spacing: 10px;
    font-weight: 400;
    text-transform: uppercase;
    font-family: Arial, Helvetica, sans-serif;
    text-shadow: 0 0 8px rgba(192, 192, 192, 0.4);
    z-index: 5;
    text-align: center;
  }

  /* Excavator */
  .excavator {
    position: absolute; width: 160px; height: 140px;
    top: -160px; left: 58%; transform: translateX(-50%);
    opacity: 0; z-index: 10; pointer-events: none; transition: none;
  }
  .cab {
    width: 70px; height: 45px;
    background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
    border: 3px solid #666; border-radius: 6px 6px 2px 2px;
    position: absolute; top: 0; left: 20px;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.15);
  }
  .cab::after {
    content: ''; position: absolute; top: 8px; left: 10px;
    width: 45px; height: 18px; background: #1a3a5c;
    border: 2px solid #333; border-radius: 2px;
  }
  .boom {
    width: 12px; height: 70px; background: linear-gradient(90deg, #555, #333);
    position: absolute; top: 30px; left: 55px; transform-origin: top center; border-radius: 2px;
  }
  .stick {
    width: 10px; height: 55px; background: linear-gradient(90deg, #555, #333);
    position: absolute; top: 90px; left: 56px; transform-origin: top center; border-radius: 2px;
  }
  .bucket {
    width: 55px; height: 35px;
    background: linear-gradient(180deg, #3a3a3a, #1a1a1a);
    border: 3px solid #555; border-radius: 0 0 8px 8px;
    position: absolute; top: 135px; left: 35px;
    transform-origin: top center; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
  }
  .bucket::before {
    content: ''; position: absolute; bottom: -8px; left: 4px; right: 4px; height: 10px;
    background: repeating-linear-gradient(90deg, #222 0 8px, transparent 8px 12px);
  }
  .bucket::after {
    content: ''; position: absolute; bottom: 4px; left: 6px; right: 6px; height: 14px;
    background: linear-gradient(to bottom, #ff6600, #cc2200);
    border-radius: 0 0 4px 4px;
    box-shadow: 0 0 12px #ff4400, 0 0 24px #ff2200;
    opacity: 0; transition: opacity 0.3s;
  }
  .bucket.has-load::after { opacity: 1; }

  .dirt-pile {
    position: absolute; width: 90px; height: 35px;
    background: radial-gradient(ellipse at center, #5a3a1a 0%, #3a2510 70%, transparent 100%);
    border-radius: 50%; bottom: 40px; left: 58%;
    transform: translateX(-50%) scale(0); opacity: 0; z-index: 3;
    box-shadow: 0 0 20px rgba(255, 80, 0, 0.3);
  }
  .ground-glow {
    position: absolute; width: 200px; height: 60px;
    background: radial-gradient(ellipse at center, rgba(255, 60, 0, 0.25) 0%, transparent 70%);
    bottom: 20px; left: 58%; transform: translateX(-50%);
    opacity: 0; z-index: 1; pointer-events: none;
  }

  /* ---- trade / state pickers ---- */
  .controls {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  .field { display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .field label {
    font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #7c7c84;
    padding-left: 4px;
  }
  .field select {
    appearance: none; -webkit-appearance: none;
    font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600;
    color: var(--silver); background: var(--panel);
    border: 1.5px solid var(--accent-soft); border-radius: 12px;
    padding: 12px 40px 12px 16px; min-width: 210px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--silver) 50%),
                      linear-gradient(135deg, var(--silver) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
    transition: border-color .2s, box-shadow .2s;
  }
  .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint); }
  .field select option { background: #141416; color: var(--silver); }

  /* ---- entry button + hint ---- */
  .enter-btn {
    font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase; color: var(--silver);
    background: var(--panel); border: 1.5px solid var(--accent-soft); border-radius: 999px;
    padding: 15px 34px; cursor: pointer; box-shadow: 0 0 20px var(--accent-faint);
    transition: background 0.25s, color 0.25s, box-shadow 0.25s, transform 0.15s, opacity .25s;
    animation: btnPulse 2.8s ease-in-out infinite;
  }
  .enter-btn:hover, .enter-btn:focus-visible {
    background: var(--accent); color: #fff; box-shadow: 0 0 34px var(--accent-soft);
    outline: none; animation: none;
  }
  .enter-btn:active { transform: scale(0.97); }
  .enter-btn[disabled] {
    opacity: 0.4; cursor: not-allowed; animation: none; box-shadow: none;
    border-color: #3a3a3e; color: #6a6a70;
  }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 0 16px var(--accent-faint); }
    50%     { box-shadow: 0 0 34px var(--accent-soft); }
  }
  .hint {
    font-family: Arial, Helvetica, sans-serif; font-size: 11px; letter-spacing: 4px;
    text-transform: uppercase; color: #6a6a70;
    animation: hintPulse 2.6s ease-in-out infinite;
  }
  @keyframes hintPulse { 0%,100%{opacity:0.35} 50%{opacity:0.85} }

  /* ---- enter transition ---- */
  .stage.entering .enter-btn,
  .stage.entering .hint,
  .stage.entering .controls { animation: fadeOut 0.35s forwards; pointer-events: none; }
  @keyframes fadeOut { to { opacity: 0; } }

  .curtain {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #170406 0%, #000 82%);
    opacity: 0; pointer-events: none; transition: opacity 0.7s ease; z-index: 9;
  }
  .curtain.show { opacity: 1; }

  .arrive {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease 0.15s; z-index: 10;
  }
  .arrive.show { opacity: 1; pointer-events: auto; }
  .arrive-inner { max-width: 520px; }
  .arrive h2 {
    font-family: 'Arial Black', Arial, sans-serif; color: var(--accent);
    letter-spacing: 1px; font-size: 24px; margin-bottom: 12px;
    text-shadow: 0 0 18px var(--accent-soft);
  }
  .arrive p {
    font-family: Arial, Helvetica, sans-serif; color: #b6b6be; font-size: 15px;
    line-height: 1.7; margin-bottom: 10px;
  }
  .arrive .disclaimer {
    display: block; margin-top: 14px; font-size: 11px; color: #6a6a70; line-height: 1.5;
  }
  .replay {
    margin-top: 22px; font-family: Arial, Helvetica, sans-serif; font-size: 12px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--silver); background: none;
    border: 1px solid #444; border-radius: 999px; padding: 10px 22px; cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  .replay:hover { border-color: var(--accent); color: #fff; }

  @media (max-width: 640px) {
    .logo { font-size: 104px; letter-spacing: -5px; }
    .subtitle { font-size: 12px; letter-spacing: 6px; }
    .logo-container { height: 210px; }
    .field select { min-width: 0; width: 78vw; }
  }
</style>

<div class="stage" id="stage">
  <div class="logo-container" id="container">
    <div class="logo" id="logo"></div>
    <div class="subtitle" id="subtitle"></div>

    <div class="excavator" id="excavator">
      <div class="cab"></div>
      <div class="boom" id="boom"></div>
      <div class="stick" id="stick"></div>
      <div class="bucket" id="bucket"></div>
    </div>

    <div class="dirt-pile" id="dirt"></div>
    <div class="ground-glow" id="glow"></div>
  </div>

  <div class="controls">
    <div class="field">
      <label for="tradeSelect">Your trade</label>
      <select id="tradeSelect" aria-label="Select your trade"></select>
    </div>
    <div class="field">
      <label for="stateSelect">State / territory</label>
      <select id="stateSelect" aria-label="Select your state or territory"></select>
    </div>
  </div>

  <button class="enter-btn" id="enterBtn" type="button" disabled>Enter Workspace &rarr;</button>
  <p class="hint" id="hint">Pick your trade to enter</p>
</div>

<div class="curtain" id="curtain"></div>
<div class="arrive" id="arrive">
  <div class="arrive-inner">
    <h2 id="arriveTitle">Entering the workspace&hellip;</h2>
    <p id="arriveBody"></p>
    <button class="replay" id="replay" type="button">Back to landing</button>
  </div>
</div>

<script>
  // ============================================================
  // EMC — trade-adaptive landing gate (prototype)
  // Everything below TRADES / JURISDICTIONS / BRAND is config:
  // this is the "adaptable" layer — in production it comes from
  // the database (see docs/schema.sql), not hard-coded here.
  // ============================================================

  // --- white-label brand (per tenant in production) ---
  const BRAND = {
    name: 'EMC',
    wordmark: 'EMC',                       // last letter is the one dug out
    subtitle: 'EARTH MOVING CREATIONS',
    accent: '#ff1a44',
    logoImage: null                        // set a URL to use an uploaded logo instead
  };

  // --- construction trades (config-driven) ---
  const TRADES = [
    { id: 'carpentry',   name: 'Carpentry' },
    { id: 'civil',       name: 'Civil' },
    { id: 'masonry',     name: 'Masonry & Bricklaying' },
    { id: 'concreting',  name: 'Concreting' },
    { id: 'earthmoving', name: 'Earthmoving & Excavation' },
    { id: 'electrical',  name: 'Electrical' },
    { id: 'plumbing',    name: 'Plumbing' },
    { id: 'roofing',     name: 'Roofing' },
    { id: 'steelfixing', name: 'Steel Fixing' },
    { id: 'plastering',  name: 'Plastering' },
    { id: 'tiling',      name: 'Tiling' },
    { id: 'painting',    name: 'Painting & Decorating' },
    { id: 'landscaping', name: 'Landscaping' },
    { id: 'demolition',  name: 'Demolition' },
    { id: 'glazing',     name: 'Glazing' },
    { id: 'hvac',        name: 'HVAC & Mechanical' }
  ];

  // --- Australian Security of Payment jurisdictions (indicative; pending legal review) ---
  const JURISDICTIONS = [
    { id: 'nsw', name: 'New South Wales',              act: 'Building & Construction Industry Security of Payment Act 1999 (NSW)' },
    { id: 'vic', name: 'Victoria',                     act: 'Building & Construction Industry Security of Payment Act 2002 (Vic)' },
    { id: 'qld', name: 'Queensland',                   act: 'Building Industry Fairness (Security of Payment) Act 2017 (Qld)' },
    { id: 'wa',  name: 'Western Australia',            act: 'Building & Construction Industry (Security of Payment) Act 2021 (WA)' },
    { id: 'sa',  name: 'South Australia',              act: 'Building & Construction Industry Security of Payment Act 2009 (SA)' },
    { id: 'tas', name: 'Tasmania',                     act: 'Building & Construction Industry Security of Payment Act 2009 (Tas)' },
    { id: 'act', name: 'Australian Capital Territory', act: 'Building & Construction Industry (Security of Payment) Act 2009 (ACT)' },
    { id: 'nt',  name: 'Northern Territory',           act: 'Construction Contracts (Security of Payments) Act 2004 (NT)' }
  ];

  // Replace with your contract app's live URL; the button will redirect with ?trade=&state=
  const APP_URL = "https://REPLACE-WITH-CONTRACT-APP-URL";

  // --- elements ---
  const root      = document.documentElement;
  const logoEl    = document.getElementById('logo');
  const subEl     = document.getElementById('subtitle');
  const cLetter   = () => document.getElementById('cLetter');
  const excavator = document.getElementById('excavator');
  const boom      = document.getElementById('boom');
  const stick     = document.getElementById('stick');
  const bucket    = document.getElementById('bucket');
  const dirt      = document.getElementById('dirt');
  const glow      = document.getElementById('glow');
  const stage     = document.getElementById('stage');
  const tradeSel  = document.getElementById('tradeSelect');
  const stateSel  = document.getElementById('stateSelect');
  const enterBtn  = document.getElementById('enterBtn');
  const hint      = document.getElementById('hint');
  const curtain   = document.getElementById('curtain');
  const arrive    = document.getElementById('arrive');
  const arriveTitle = document.getElementById('arriveTitle');
  const arriveBody  = document.getElementById('arriveBody');
  const replay    = document.getElementById('replay');

  const reduceMotion  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isPlaceholder = APP_URL.indexOf('REPLACE-WITH') !== -1;
  let entering = false;

  // --- apply brand ---
  function applyBrand() {
    root.style.setProperty('--accent', BRAND.accent);
    subEl.textContent = BRAND.subtitle;
    const w = BRAND.wordmark;
    const head = w.slice(0, -1), last = w.slice(-1);
    logoEl.innerHTML = head + '<span class="c-letter" id="cLetter">' + last + '</span>';
  }

  // --- populate pickers ---
  function fillSelects() {
    tradeSel.innerHTML = '<option value="" selected disabled>— Select your trade —</option>' +
      TRADES.map(t => '<option value="' + t.id + '">' + t.name + '</option>').join('');
    stateSel.innerHTML = JURISDICTIONS.map((j, i) =>
      '<option value="' + j.id + '"' + (j.id === 'nsw' ? ' selected' : '') + '>' + j.name + '</option>').join('');
  }

  tradeSel.addEventListener('change', () => {
    const ok = !!tradeSel.value;
    enterBtn.disabled = !ok;
    hint.textContent = ok ? 'Tap to enter your workspace' : 'Pick your trade to enter';
  });

  // --- looping excavator animation ---
  const T = { drop:1200, excavatorIn:800, pickup:900, place:1100, excavatorOut:700, settle:1400 };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const setTransform = (el, t) => { el.style.transform = t; };

  function resetAll() {
    const c = cLetter();
    c.style.transition = 'none'; c.style.transform = 'translate(0,0) rotate(0deg)'; c.style.opacity = '1';
    excavator.style.transition = 'none'; excavator.style.opacity = '0';
    excavator.style.top = '-160px'; excavator.style.left = '58%';
    boom.style.transform = stick.style.transform = bucket.style.transform = 'rotate(0deg)';
    bucket.classList.remove('has-load');
    dirt.style.transition = 'none'; dirt.style.transform = 'translateX(-50%) scale(0)'; dirt.style.opacity = '0';
    glow.style.opacity = '0';
    void c.offsetWidth;
  }

  async function runCycle() {
    if (entering) return;
    const c = cLetter();
    resetAll();

    c.style.transition = 'transform 1.1s cubic-bezier(0.55,0.05,0.65,0.9), opacity 0.8s ease';
    await sleep(50);
    setTransform(c, 'translate(8px, 158px) rotate(28deg)'); c.style.opacity = '0.85';
    await sleep(T.drop);

    excavator.style.transition = 'top 0.7s cubic-bezier(0.22,1,0.36,1), opacity 0.5s ease';
    excavator.style.opacity = '1'; excavator.style.top = '10px';
    await sleep(T.excavatorIn);

    glow.style.transition = 'opacity 0.4s'; glow.style.opacity = '1';
    dirt.style.transition = 'transform 0.6s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s';
    dirt.style.opacity = '1'; dirt.style.transform = 'translateX(-50%) scale(1)';
    for (let i = 0; i < 3; i++) {
      boom.style.transition = stick.style.transition = bucket.style.transition = 'transform 0.28s ease-in';
      setTransform(boom,'rotate(18deg)'); setTransform(stick,'rotate(25deg)'); setTransform(bucket,'rotate(35deg)');
      await sleep(280);
      boom.style.transition = stick.style.transition = bucket.style.transition = 'transform 0.22s ease-out';
      setTransform(boom,'rotate(-5deg)'); setTransform(stick,'rotate(-8deg)'); setTransform(bucket,'rotate(-10deg)');
      await sleep(220);
    }

    bucket.classList.add('has-load');
    c.style.transition = 'transform 0.7s cubic-bezier(0.25,0.8,0.25,1), opacity 0.3s';
    setTransform(c, 'translate(55px, 55px) rotate(-15deg)'); c.style.opacity = '1';
    await sleep(T.pickup);

    excavator.style.transition = 'top 0.6s ease'; excavator.style.top = '-30px';
    setTransform(c, 'translate(55px, -40px) rotate(0deg)');
    await sleep(600);
    excavator.style.transition = 'top 0.8s cubic-bezier(0.4,0,0.2,1), left 0.8s ease';
    excavator.style.top = '10px'; excavator.style.left = '50%';
    c.style.transition = 'transform 0.85s cubic-bezier(0.4,0,0.2,1)';
    setTransform(c, 'translate(0,0) rotate(0deg)');
    await sleep(T.place);

    bucket.classList.remove('has-load');
    c.style.transition = 'none'; setTransform(c, 'translate(0,0) rotate(0deg)'); c.style.opacity = '1';

    dirt.style.transition = 'opacity 0.5s, transform 0.5s';
    dirt.style.opacity = '0'; dirt.style.transform = 'translateX(-50%) scale(0.3)'; glow.style.opacity = '0';
    excavator.style.transition = 'top 0.7s ease, opacity 0.5s ease';
    excavator.style.top = '-160px'; excavator.style.opacity = '0';
    await sleep(T.excavatorOut);

    await sleep(T.settle);
    runCycle();
  }

  // --- entry handling (carries trade + state context) ---
  function finish() {
    const t = TRADES.find(x => x.id === tradeSel.value);
    const j = JURISDICTIONS.find(x => x.id === stateSel.value);
    if (isPlaceholder) {
      arriveTitle.textContent = 'Entering the ' + t.name + ' workspace';
      arriveBody.innerHTML =
        'Scoped to <b>' + t.name + '</b> &middot; <b>' + j.name + '</b>.<br>' +
        'Everything inside — contract templates, payment-claim deadlines and dispute tools — ' +
        'follows <b>' + j.act + '</b>.' +
        '<span class="disclaimer">Prototype hand-off. Legislation references are indicative and pending legal review. ' +
        'Add your contract app URL and the button redirects with <code>?trade=' + t.id + '&amp;state=' + j.id + '</code>.</span>';
      arrive.classList.add('show');
    } else {
      const url = new URL(APP_URL);
      url.searchParams.set('trade', tradeSel.value);
      url.searchParams.set('state', stateSel.value);
      window.location.href = url.toString();
    }
  }

  function enter() {
    if (entering || enterBtn.disabled) return;
    entering = true;
    stage.classList.add('entering');
    if (reduceMotion) { curtain.classList.add('show'); setTimeout(finish, 350); return; }
    setTimeout(() => curtain.classList.add('show'), 700);
    setTimeout(finish, 1250);
  }

  function reset() {
    entering = false;
    stage.classList.remove('entering');
    curtain.classList.remove('show');
    arrive.classList.remove('show');
    if (!reduceMotion) runCycle();
  }

  enterBtn.addEventListener('click', enter);
  replay.addEventListener('click', reset);

  // --- init ---
  applyBrand();
  fillSelects();
  window.addEventListener('load', () => {
    if (reduceMotion) return;
    setTimeout(runCycle, 600);
  });
</script>
</body>
</html>
