<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Diamond Welding & Fabrication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000000;
        }

        /* Diamond image */
        .diamond-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            z-index: 1;
            filter: brightness(1) contrast(1.1);
        }

        /* Vein glow overlay - subtle until activated */
        .vein-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1.5;
            background: radial-gradient(circle at center, rgba(249, 115, 22, 0.05) 0%, transparent 70%);
            opacity: 0.2;
            transition: opacity 0.3s ease;
        }

        /* Active vein glow */
        .vein-glow.active {
            opacity: 0.8;
            animation: vein-pulse 0.8s ease-out;
        }

        @keyframes vein-pulse {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        /* Center button - positioned at diamond center */
        .diamond-button {
            position: absolute;
            width: 140px;
            height: 140px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: radial-gradient(circle at 35% 35%, rgba(249, 115, 22, 0.9), rgba(217, 119, 6, 0.6));
            border: 3px solid rgba(249, 115, 22, 0.8);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                0 0 30px rgba(249, 115, 22, 0.6),
                inset 0 0 30px rgba(249, 115, 22, 0.3);
            animation: button-glow 2.5s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes button-glow {
            0%, 100% {
                box-shadow:
                    0 0 30px rgba(249, 115, 22, 0.6),
                    inset 0 0 30px rgba(249, 115, 22, 0.3);
            }
            50% {
                box-shadow:
                    0 0 60px rgba(249, 115, 22, 0.9),
                    inset 0 0 40px rgba(249, 115, 22, 0.6);
            }
        }

        .diamond-button:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow:
                0 0 80px rgba(249, 115, 22, 0.9),
                inset 0 0 50px rgba(249, 115, 22, 0.7);
        }

        .diamond-button:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* Button text */
        .button-text {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(249, 115, 22, 0.8);
        }

        /* Spark animation */
        @keyframes spark-burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .spark {
            position: fixed;
            pointer-events: none;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #fbbf24, #f97316);
            border-radius: 50%;
            animation: spark-burst 1.2s ease-out forwards;
            box-shadow: 0 0 15px #f97316;
        }

        /* Loading state */
        .loading-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0);
            display: none;
            align-items: center;
            justify-content: center;
            animation: fade-in 0.3s ease-out forwards;
        }

        .loading-overlay.active {
            display: flex;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-text {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .diamond-button {
                width: 100px;
                height: 100px;
            }

            .button-text {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <img src="assets/diamond-splash.jpeg" alt="Diamond" class="diamond-image">
        <div class="vein-glow"></div>

        <button class="diamond-button" onclick="activateDiamond()" title="Enter">
            <span class="button-text">Enter</span>
        </button>

        <div class="loading-overlay">
            <div class="loading-text">Entering...</div>
        </div>
    </div>

    <script>
        function createSpark(x, y) {
            const spark = document.createElement('div');
            spark.className = 'spark';

            const angle = Math.random() * Math.PI * 2;
            const velocity = 100 + Math.random() * 300;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;

            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            spark.style.setProperty('--tx', tx + 'px');
            spark.style.setProperty('--ty', ty + 'px');

            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 1200);
        }

        function activateDiamond() {
            const button = document.querySelector('.diamond-button');
            const veinglow = document.querySelector('.vein-glow');
            const loading = document.querySelector('.loading-overlay');
            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Disable button
            button.disabled = true;
            button.style.pointerEvents = 'none';

            // Create massive spark burst
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    createSpark(centerX, centerY);
                }, i * 20);
            }

            // Light up the veins
            setTimeout(() => {
                veinglow.classList.add('active');
            }, 100);

            // Show loading text
            setTimeout(() => {
                loading.classList.add('active');
            }, 300);

            // Transition to landing page
            setTimeout(() => {
                window.location.href = 'landing.html';
            }, 1800);
        }

        // Allow Enter key or spacebar
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                document.querySelector('.diamond-button').click();
            }
        });
    </script>
</body>
</html>
