<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Diamond Welding & Fabrication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Textured black background */
        .landing-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            background: 
                linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.02) 2px,
                    rgba(255, 255, 255, 0.02) 4px
                );
            background-blend-mode: overlay;
        }

        /* Textured overlay */
        .landing-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" /><feColorMatrix type="saturate" values="0"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.05"/></svg>');
            pointer-events: none;
            z-index: 1;
        }

        /* Diamond image - positioned at bottom, partial view */
        .diamond-image {
            position: absolute;
            bottom: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: auto;
            max-width: 1200px;
            z-index: 2;
            filter: brightness(1) contrast(1.05);
            opacity: 0.9;
        }

        /* Diamond illuminate effect */
        .diamond-image.illuminate {
            animation: illuminate 1s ease-out forwards;
            filter: brightness(2) contrast(1.3);
        }

        @keyframes illuminate {
            0% {
                filter: brightness(1) contrast(1.05);
                opacity: 0.9;
            }
            50% {
                filter: brightness(1.8) contrast(1.2);
                opacity: 1;
            }
            100% {
                filter: brightness(2.2) contrast(1.4);
                opacity: 1;
            }
        }

        /* Glow effect around diamond */
        .diamond-glow {
            position: absolute;
            bottom: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1200px;
            height: auto;
            z-index: 1.5;
            filter: blur(40px);
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .diamond-glow.active {
            animation: glow-pulse 1s ease-out forwards;
        }

        @keyframes glow-pulse {
            0% { opacity: 0.3; filter: blur(40px); }
            50% { opacity: 0.8; filter: blur(60px); }
            100% { opacity: 0.6; filter: blur(50px); }
        }

        /* Center interactive button */
        .enter-button {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 35% 35%, rgba(249, 115, 22, 0.8), rgba(217, 119, 6, 0.5));
            border: 2px solid rgba(249, 115, 22, 0.7);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 25px rgba(249, 115, 22, 0.5),
                inset 0 0 20px rgba(249, 115, 22, 0.2);
            animation: button-glow 2.5s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.7);
        }

        @keyframes button-glow {
            0%, 100% {
                box-shadow: 
                    0 0 25px rgba(249, 115, 22, 0.5),
                    inset 0 0 20px rgba(249, 115, 22, 0.2);
            }
            50% {
                box-shadow: 
                    0 0 50px rgba(249, 115, 22, 0.8),
                    inset 0 0 30px rgba(249, 115, 22, 0.4);
            }
        }

        .enter-button:hover {
            transform: translateX(-50%) scale(1.15);
            box-shadow: 
                0 0 60px rgba(249, 115, 22, 0.9),
                inset 0 0 40px rgba(249, 115, 22, 0.5);
        }

        .enter-button:active {
            transform: translateX(-50%) scale(0.9);
        }

        /* Spark animation */
        @keyframes spark-burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .spark {
            position: fixed;
            pointer-events: none;
            width: 5px;
            height: 5px;
            background: radial-gradient(circle, #fbbf24, #f97316);
            border-radius: 50%;
            animation: spark-burst 1s ease-out forwards;
            box-shadow: 0 0 12px #f97316;
        }

        /* Loading state */
        .loading-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 30;
            background: rgba(0, 0, 0, 0);
            display: none;
            align-items: center;
            justify-content: center;
            animation: fade-in 0.5s ease-out forwards;
        }

        .loading-overlay.active {
            display: flex;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-text {
            font-size: 1rem;
            letter-spacing: 2px;
            color: rgba(249, 115, 22, 0.8);
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .diamond-image {
                bottom: -30%;
            }

            .diamond-glow {
                bottom: -25%;
            }

            .enter-button {
                width: 80px;
                height: 80px;
                font-size: 0.65rem;
                bottom: 15%;
            }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="diamond-glow"></div>
        <img src="assets/diamond-splash.jpeg" alt="Diamond" class="diamond-image">
        
        <button class="enter-button" onclick="activateLanding()">
            Enter
        </button>

        <div class="loading-overlay">
            <div class="loading-text">Illuminating...</div>
        </div>
    </div>

    <script>
        function createSpark(x, y) {
            const spark = document.createElement('div');
            spark.className = 'spark';

            const angle = Math.random() * Math.PI * 2;
            const velocity = 80 + Math.random() * 200;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;

            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            spark.style.setProperty('--tx', tx + 'px');
            spark.style.setProperty('--ty', ty + 'px');

            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 1000);
        }

        function activateLanding() {
            const button = document.querySelector('.enter-button');
            const diamond = document.querySelector('.diamond-image');
            const glow = document.querySelector('.diamond-glow');
            const loading = document.querySelector('.loading-overlay');
            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Disable button
            button.disabled = true;
            button.style.pointerEvents = 'none';

            // Create spark burst
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    createSpark(centerX, centerY);
                }, i * 25);
            }

            // Illuminate diamond
            setTimeout(() => {
                diamond.classList.add('illuminate');
                glow.classList.add('active');
            }, 150);

            // Show loading
            setTimeout(() => {
                loading.classList.add('active');
            }, 400);

            // Transition to portfolio
            setTimeout(() => {
                window.location.href = 'portfolio.html';
            }, 2000);
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                document.querySelector('.enter-button').click();
            }
        });
    </script>
</body>
</html>
